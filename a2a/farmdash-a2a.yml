non_standard_note: Seven non-A2A top-level objects. They carry the most operationally useful content in the file — the full REST endpoint map, the X-RateLimit-*/X-Request-ID/X-Payment-* response header contract, the three-tier price list, and the zero-custody risk bounds — but no A2A client will read any of it. This card is best understood as a FarmDash-native discovery document wearing A2A field names.
