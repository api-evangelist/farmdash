grade_rubric: A2A 1.0.0
grade_basis: 'capabilities IS a JSON object (streaming/pushNotifications/stateTransitionHistory) and skills IS an array of 4 objects — both hard checks pass. The card FAILS the protocolVersion hard check: it declares the value under the snake_case key `protocol_version` (0.2.0), not the A2A-required camelCase `protocolVersion`, so a conformant parser reads protocolVersion as absent. That is a hard failure, hence flavored.'
deviations:
- key: protocol_version
  expected: protocolVersion
  detail: Snake_case key instead of the A2A camelCase field name; value 0.2.0 also predates A2A 1.0.0. A spec-conformant client cannot negotiate a protocol version from this card.
  severity: hard
- key: preferredTransport
  expected: present
  detail: Absent. No transport is declared, so a client cannot tell how to reach the agent.
  severity: optional
- key: authentication
  expected: securitySchemes / security (A2A 1.0)
  detail: Uses a bespoke `authentication.schemes[]` array (bearer, x402, eip191) rather than the A2A securitySchemes shape. The content is rich and honest but is not machine-parseable by an A2A client.
  severity: soft
- key: provider
  expected: present
  detail: Absent; publisher identity is carried in a non-standard top-level `contact` object instead.
  severity: optional
- key: skills[].tags / skills[].examples
  expected: present
  detail: Skills carry id/name/description but omit the A2A tags[] and examples[] fields.
  severity: optional
