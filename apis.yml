name: FarmDash Agent Hub
aid: farmdash
description: >-
  FarmDash is a zero-custody intelligence and control layer for DeFi agents and airdrop farmers, combining Trail Heat
  opportunity scoring, Signal Architect swap routing, wallet and Sybil-risk intelligence, and Hyperliquid futures
  research across EVM, Solana, HyperEVM and StarkNet. It is one of the most thoroughly agent-instrumented providers
  in the catalog: a live OpenAPI 3.1.0 with 27 operations, an 84-tool MCP manifest carrying full input schemas, an
  A2A-flavored agent card, an ai-plugin manifest, llms.txt, ai.txt, a machine-readable agent report, and a runtime
  capability contract that the provider declares authoritative over tool discovery. Auth is tiered API keys (Scout
  free / Pioneer $39.99 / Syndicate $199, all USDC) with a verified live x402 machine-payment fallback settling on
  Base. Writes are gated by mandatory pre-execution simulation and user-held EIP-191/EIP-712 signatures — FarmDash
  never broadcasts and never holds keys.
