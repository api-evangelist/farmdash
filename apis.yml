apis:
- name: FarmDash Agent Hub API
  description: >-
    Unified zero-custody DeFi agent API: Trail Heat protocol intelligence, swap quotes with a mandatory simulation
    gate and user-signed execution, wallet/Sybil intelligence, and guarded Hyperliquid futures research. 27 operations
    across 23 paths in a live OpenAPI 3.1.0 (73 component schemas). The same product also ships an 84-tool MCP server
    manifest — roughly 3x the REST surface — so 57 tools have no published REST equivalent (see mcp/farmdash-tool-crosswalk.yml).
    x402 is VERIFIED LIVE, not merely documented: an unauthenticated GET on /api/v1/agent/sybil-audit returned HTTP
    402 on 2026-08-26 carrying a complete x402 challenge (4.99 USDC, Base, chainId 8453, treasury and token contract,
    PAYMENT-SIGNATURE and X-Payment-Proof headers). baseURL corrected from the website root to the spec's declared
    server https://www.farmdash.one/api.
