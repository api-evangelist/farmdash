name: FarmDash Agent Hub
aid: farmdash
description: 'FarmDash provides DeFi research and guarded transaction workflows for wallets and agents:
  live quantitative Trail Heat, a separate editorial protocol catalog, wallet/Sybil signals, EVM swap
  preparation, and a distinct guarded Hyperliquid order workflow. The public REST contract has 43 operations
  across 15 OpenAPI tags; runtime availability and tier gates come from the live status contract. Compatibility
  swaps are limited to six EVM networks and the customer signs and submits; Solana is preview-only and
  0x is operator-paused. Hyperliquid orders can change real exposure and require explicit user authorization.
  The public MCP source is a local stdio server with 84 tools; no hosted remote MCP endpoint or published
  npm package is claimed. Current fees and limits are published separately. FarmDash does not receive
  raw customer private keys, and A2A transport is not exposed.'
url: https://raw.githubusercontent.com/api-evangelist/farmdash/main/apis.yml
