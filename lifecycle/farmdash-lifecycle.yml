deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No deprecation policy page, no RFC 8594 Sunset/Deprecation header support documented, and
    zero operations carry `deprecated: true` in the OpenAPI. Probed https://www.farmdash.one/roadmap
    (404). What FarmDash publishes INSTEAD is unusual and arguably more useful to an agent: a
    forward-looking capability contract rather than a backward-looking deprecation contract —
    /api/v1/agent/status declares per-feature availability so a caller learns a feature is not
    ready before calling it, rather than learning a feature is going away after depending on it.
    The two are complements, and only one is present.
