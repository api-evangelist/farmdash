  runtime_substitute:
    url: https://www.farmdash.one/api/v1/agent/status
    http_status: 200
    checked: '2026-08-26'
    detail: >-
      A machine-readable runtime capability contract, not an incident/uptime page. It reports
      per-feature availability (available / paid_ready / available_with_tier_gate /
      preparation_only / deployment_prerequisites_required / server_verified), the intent
      contract, live operation gates, the error contract, the developer sandbox and the tier
      summary. It answers "can I call this?" but NOT "is it up right now, and was it down
      yesterday?" — there is no uptime history, no incident log and no subscription channel.
