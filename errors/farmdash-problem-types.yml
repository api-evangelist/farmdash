  remediation: Read https://www.farmdash.one/api/v1/agent/status before retrying; the feature may be disabled by design.
  retryable: true
dust_storm_protocol:
  description: >-
    FarmDash's named contract for upstream failure. On provider degradation it returns
    ok:false with a typed degraded state and a warnings[] array containing
    {kind:"dust_storm", message:"..."}. Cached SDK responses may be returned as stale with an
    explicit stale-data age.
  invariant: >-
    "Provider failure is never converted into authoritative zero financial data." This is a
    materially important guarantee for an agent making allocation decisions — an upstream
    outage cannot silently present as a zero balance or a zero price.
  source: https://www.farmdash.one/llms.txt
evidence_state_contract:
  description: >-
