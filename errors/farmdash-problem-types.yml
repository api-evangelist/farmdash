format: bespoke-json
rfc9457: false
format_note: >-
  FarmDash does NOT use RFC 9457 application/problem+json. It ships a stable, well-specified
  bespoke envelope on application/json, declared as the ErrorResponse schema in the OpenAPI
  and confirmed byte-for-byte on live 402 and 404 responses. The envelope is arguably
  better-behaved than most problem+json implementations — it carries an explicit machine
  `retryable` boolean and a `request_id` on every error — but it is not the standard media
  type, so generic RFC 9457 client middleware will not parse it.
envelope:
  media_type: application/json
  stable_fields:
  - ok
  - error
  - code
  - message
  - retryable
  - request_id
  - rate_limit
  - x402
  - developer_sandbox
  optional_fields:
  - details
  - tier
  - upgrade_url
  - direct_upgrade_url
  - api_key_url
  - scout_access
  - agent_actions
  - warnings
  source: >-
    stable_fields[] is published verbatim by the provider at
    https://www.farmdash.one/api/v1/agent/status under error_contract.stable_fields.
  example_observed:
    url: https://www.farmdash.one/api/mcp
    http_status: 404
    body: '{"ok":false,"error":"not_found","code":"api_endpoint_not_found","message":"API endpoint not found.","retryable":false,"request_id":"e8bf6539-..."}'
problem_types:
- status: 400
  code: bad_request
  title: Invalid request
  operations: 12
  remediation: Correct the request parameters or body; validation errors are not retryable as sent.
  retryable: false
- status: 401
  code: unauthorized
  title: Invalid API key, signature, or session capability token
  operations: 4
  variants:
  - operation: executeSwap
    detail: Invalid signature or expired nonce (EIP-191).
  - operation: getLiveTrailHeat
    detail: Invalid API key.
  - operation: manageSession
    detail: Missing or invalid session capability token.
  - operation: manageAutopilot
    detail: Missing or invalid session capability token.
  remediation: Re-sign the payload with a fresh nonce, or present a valid bearer key / session token.
  retryable: false
- status: 402
  code: payment_required
  title: Payment required — quota exhausted or paid-tier route
  operations: 24
  detail: >-
    The single most common error in this API: 24 of 27 operations declare it. It doubles as
    the rate-limit exhaustion response. The body carries a complete x402 challenge
    (price, currency, network, token contract, treasury, amount in base units, policy_key,
    compute_class) plus a sandbox fallback and an upgrade URL.
  remediation: >-
    Pay the stated USDC amount on Base to the treasury and retry with PAYMENT-SIGNATURE or
    X-Payment-Proof; or upgrade a tier; or retry a mock-capable endpoint with ?mock=true.
  retryable: true
  verified_live:
    url: https://www.farmdash.one/api/v1/agent/sybil-audit?agentAddress=0x0000000000000000000000000000000000000000
    http_status: 402
    checked: '2026-08-26'
