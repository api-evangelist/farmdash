  code: forbidden
  title: Session owner or token verification failed
  operations: 2
  remediation: The caller does not own the session being addressed. Re-create the session under the correct agent address.
  retryable: false
- status: 405
  code: method_not_allowed
  title: Method not allowed
  operations: 1
  retryable: false
- status: 409
  code: conflict
  title: State conflict — intent/wallet mismatch or guardrail halt
  operations: 2
  variants:
  - operation: simulateSwapExecution
    detail: Intent and wallet mismatch.
  - operation: executeSwap
    detail: Swap halted by Risk Sentinel guardrails.
  remediation: Re-quote against the correct wallet, or resolve the Risk Sentinel finding before retrying.
  retryable: false
- status: 428
  code: precondition_required
  title: Missing, expired, failed, or mismatched preflight simulation
  operations: 1
  detail: >-
    RFC 6585 428 used exactly as intended and rarely seen in the wild. executeSwap refuses to
    run without a fresh successful simulateSwapExecution result — the simulation must be under
    60 seconds old. This is the mechanical enforcement of FarmDash's rehearse-before-you-act
    posture.
  remediation: Call POST /v1/simulate and retry within 60 seconds with the returned intent.
  retryable: true
- status: 429
  code: rate_limited
  title: Too many requests
  operations: 10
  detail: >-
    Declared on 10 operations, but the observed exhaustion response on a live unauthenticated
    probe was 402, not 429. Treat 429 as declared-but-not-confirmed.
  remediation: Back off, then retry; consult Retry-After where present.
  retryable: true
- status: 502
  code: provider_degraded
  title: Typed upstream provider degradation (Dust Storm)
  operations: 4
  variants:
  - operation: getSwapQuote
    detail: Live quote provider degradation.
  - operation: getTokenPrices
    detail: Upstream price degradation.
  - operation: scanFundingRates
    detail: Hyperliquid funding provider degradation.
  - operation: getMarketConditions
    detail: Hyperliquid candle provider degradation.
  remediation: Retry with backoff. Never interpret a degraded response as a zero balance, price or quote.
  retryable: true
- status: 503
  code: feature_not_ready
  title: Service degraded or feature not provisioned
  operations: 2
  detail: >-
    Also the documented status for the capability contract: the provider states that 503
    responses carry a typed feature_not_ready state when a tool exists but its deployment
