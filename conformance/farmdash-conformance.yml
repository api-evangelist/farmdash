    network Base, network_caip2 eip155:8453, token 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913,
    amount 4990000, destination 0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377, policy_key
    sybil_audit, plus payment_required_header PAYMENT-REQUIRED, signature_header
    PAYMENT-SIGNATURE and response_header PAYMENT-RESPONSE.
  deviation: >-
    Supports the standard PAYMENT-SIGNATURE header AND a bespoke legacy path
    (X-Payment-Proof: 0x<txHash>), which the provider labels "the legacy FarmDash proof path".
    A pure x402 client should use PAYMENT-SIGNATURE.
