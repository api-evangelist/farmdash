  domain: agentic payments
  conforms: true
  declared_in_contract: true
  evidence: >-
    The CONTRACT declares it, not just a marketing page. The OpenAPI defines a
    PaymentRequiredError component schema and attaches a 402 response to 24 of 27 operations,
    and a live unauthenticated GET on /api/v1/agent/sybil-audit returned HTTP 402 (verified
