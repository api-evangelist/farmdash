source: well-known/farmdash-mcp.json + openapi/farmdash-agent-api-openapi.yaml
note: 'Bound each of the 84 MCP tools published in FarmDash''s own mcp.json to the operationIds in its
  published OpenAPI 3.1.0. The MCP surface is roughly 3x the REST surface: only 27 tools have a backing
  published REST operation, and 57 are MCP-only. That gap is not sloppiness — several MCP-only tools call
  endpoints FarmDash documents in llms.txt, the agent card and the live status contract (/v1/agent/balances,
  /v1/agent/sybil-audit, /v1/agent/optimize-portfolio, /v1/agent/performance, /v1/agent/ledger, /v1/agent/receipts)
  that were simply never added to the OpenAPI. The rest are genuinely composite or belong to preview subsystems
  (MEE cross-chain, Virtuals ACP) that the live status contract reports as preparation_only or prerequisite-dependent.'
