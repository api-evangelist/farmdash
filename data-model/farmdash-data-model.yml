critical_path:
  name: swap settlement chain
  steps:
  - operation: getSwapQuote
    emits: intent_id
  - operation: simulateSwapExecution
    consumes: intent_id
    emits: simulation_id
    guard: 409 on intent/wallet mismatch
  - operation: executeSwap
    consumes: [intentId, simulationId]
    emits: feeEventId + calldata
    guard: 428 if simulation missing/expired (>60s); 409 on Risk Sentinel halt; 401 on bad EIP-191 signature
  - operation: (off-API)
    detail: The user's own wallet signs and broadcasts. FarmDash never broadcasts.
  - operation: confirmSwap
    consumes: [feeEventId, txHash, agentAddress]
    detail: Server verifies the on-chain receipt against committed fee fields.
  note: >-
    Four API calls and one off-API signature to move tokens. Every gate is a distinct HTTP status
    an agent can branch on, which makes this one of the more legible write paths in the catalog —
    despite the absence of an idempotency key.
