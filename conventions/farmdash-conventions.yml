request_id_tracing:
  supported: true
  response_header: X-Request-ID
  format: UUID v4
  body_field: request_id
  observed: true
  observed_evidence: 'x-request-id: b3cd9816-9185-4a52-8bc4-ecfa82ba6690 on a live 200 (2026-08-26)'
  note: >-
    Present on both success and error responses, in the header AND in the error body. This is
    the best-implemented convention in the API.

versioning:
  style: path-prefix
  detail: >-
    Mixed. Most operations sit under /v1/ (/v1/agent/*, /v1/simulate, /v1/trail-heat) but the
    swap family is unversioned (/agents/quote, /agents/swap, /agents/confirm, /agents/history).
    The base URL https://www.farmdash.one/api therefore serves two versioning regimes at once.
  spec_version: 2.0.0 (info.version)
  header_versioning: false
  no_declared_policy: true

error_envelope:
