auth_style:
  primary: 'HTTP bearer token (Authorization: Bearer <key>)'
  anonymous_tier: true
  anonymous_detail: >-
    Scout works with no Authorization header at all, or with the public literal
    fd_scout_free. 12 of 27 operations declare `security: [{bearerAuth: []}, {}]` — the
    empty scheme makes anonymous access explicit in the contract.
  additional_schemes:
  - scheme: eip191
    usage: >-
      personal_sign over v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}
      — required for zero-custody swap execution.
  - scheme: eip712
    usage: Typed-data signature required for Hyperliquid perp order execution and for IntentApproval payloads.
  - scheme: x402
    usage: One-off USDC payment over HTTP 402; retry with PAYMENT-SIGNATURE or X-Payment-Proof.
  - scheme: session-capability-token
    usage: >-
      Bounded session tokens (32-256 chars) required by manageSession, manageAutopilot and
      every MCP intent-lifecycle tool. 401/403 distinguish missing-token from wrong-owner.
  note: >-
    Only bearerAuth is declared in components.securitySchemes; the four other schemes are
    documented in prose and in the agent card but are NOT machine-readable from the spec.

idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  finding: >-
    NO IDEMPOTENCY KEY. There is no Idempotency-Key header anywhere in the OpenAPI (zero
    occurrences of the string), none in the MCP tool input schemas, and none in the agent
    card's response-header contract. For an API whose write surface moves real money on
    Base and places real perpetual futures orders on Hyperliquid, this is the single
    largest agent-safety gap in the contract.
  compensating_controls:
  - control: mandatory-simulation-gate
    detail: >-
      executeSwap returns 428 unless a fresh successful simulateSwapExecution exists within
      60 seconds. A duplicate execute without a fresh simulation is refused rather than
      re-executed.
  - control: wallet-bound intent IDs
    detail: >-
      Quotes return wallet-bound intent IDs and simulateSwapExecution returns 409 on
      intent/wallet mismatch, so an intent cannot be replayed against a different wallet.
  - control: user-held signature
    detail: >-
      FarmDash never broadcasts. executeSwap returns calldata the user's own wallet signs and
      submits, so chain-level nonce semantics — not the API — are the final duplicate defence
      for swaps.
  - control: research gate
    detail: >-
      analyze_strategy required within 5 minutes before perps execution; simulate_swap_execution
      required within 60 seconds before swap execution.
  residual_risk: >-
    The compensating controls narrow the window but do not close it. Two executeSwap calls
    against the SAME fresh simulation inside the 60-second window have no declared
    deduplication, and confirmSwap has no replay guard in the spec.

pagination:
  style: limit-offset
  supported_operations:
  - getSwapHistory
  params:
  - name: limit
    in: query
  - name: offset
    in: query
  response_fields: not declared in the spec
  coverage: >-
    Only 1 of 27 operations paginates. Collection reads such as getProtocolCatalog and
    getLiveTrailHeat return whole datasets with no page controls — workable at the current
    catalogue size (81 protocols) but with no declared ceiling.

