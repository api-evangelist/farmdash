header_gap:
  finding: >-
    DOCUMENTED BUT NOT SERVED ON THE PATHS PROBED. The OpenAPI states "All responses include
    X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset", and the agent card
    repeats the same contract. A live GET /api/v1/agent/protocols?mock=true returned HTTP 200
    with x-request-id and strict-transport-security but NO X-RateLimit-* header of any kind.
    An agent that relies on the documented runtime signal to pace itself will not find it on
    this route.
  mitigation: >-
    The equivalent data IS returned in the BODY of a 402: rate_limit{tier, used, limit,
    remaining, reset_epoch_seconds}. So the signal exists, but only after exhaustion and only
    in-band, which is strictly worse for an agent than headers on every response.
  checked: '2026-08-26'
exhaustion:
  status_code: 402
  status_note: >-
    FarmDash returns 402 Payment Required rather than 429 when the Scout quota is exhausted —
    the quota wall and the paywall are the same wall. 429 is declared in the OpenAPI for
    several operations (getSwapQuote, simulateSwapExecution, executeSwap, getSwapHistory,
    getProtocolCatalog, getLiveTrailHeat, getTokenPrices, getChainBreakdown,
    scanFundingRates, analyzeRiskSentinel) but the observed exhaustion response was 402.
  body_fields:
  - ok
  - error
  - code
  - message
  - retryable
  - request_id
  - tier
  - rate_limit
  - x402
  - developer_sandbox
  - upgrade_url
  recovery_paths:
  - Pay the stated x402 amount in USDC on Base and retry with X-Payment-Proof or PAYMENT-SIGNATURE.
  - Upgrade a tier at https://www.farmdash.one/pricing.
  - 'Fall back to the unmetered deterministic sandbox: ?mock=true on /v1/agent/protocols or /v1/trail-heat.'
