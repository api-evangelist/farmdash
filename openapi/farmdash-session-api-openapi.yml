    VirtualsAcpUint256:
      type: string
      pattern: ^\d{1,78}$
      x-maximum-decimal: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
      description: Nonnegative decimal integer string; runtime additionally rejects values above uint256 maximum (2^256 - 1). The x-maximum-decimal extension records that application-level bound, not a JSON Schema numeric maximum on a string.
    VirtualsAcpAuthorizeTenderParams:
      type: object
