    VirtualsAcpNonce:
      type: string
      pattern: ^\d{10,20}$
      description: Fresh millisecond timestamp; approval verification also enforces freshness, expiry and atomic nonce consumption
    VirtualsAcpCreateTenderParams:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      - task
      - simulationId
      - expectedOutputAmount
      - expectedGasUsdCents
      - expectedYieldUsdCents
      - maxPaymentUnits
      - providers
      - approvalNonce
      - approvalExpiresAt
      properties:
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 200
        task:
          description: JSON-serializable value whose JSON encoding length is greater than 1 and at most 16,384 characters; omitted task is rejected by canSerializeTask. FarmDash retains only its commitment hash; plaintext stays with the connector.
        simulationId:
          type: string
          minLength: 1
          maxLength: 200
        expectedOutputAmount:
          type: string
          pattern: ^\d+(?:\.\d+)?$
          description: Positive decimal string; runtime additionally requires numeric value greater than zero
          x-exclusive-minimum-decimal: '0'
        expectedGasUsdCents:
          $ref: '#/components/schemas/VirtualsAcpPostgresBigint'
        expectedYieldUsdCents:
          $ref: '#/components/schemas/VirtualsAcpPostgresBigint'
        maxPaymentUnits:
          $ref: '#/components/schemas/VirtualsAcpUint256'
        providers:
