    VirtualsAcpResult:
      type: object
      required:
      - ok
      additionalProperties: true
      description: Open action-dependent success envelope, not a request schema. Fields vary by action; an ok response is not customer-wallet spend authority, execution proof or final settlement proof.
      properties:
        ok:
          type: boolean
          const: true
        tender:
          type: object
          additionalProperties: true
          description: Owned public tender commitment/state when returned
        spend_authority:
          type: string
          enum:
          - none_selection_only
          - none_draft_only
          - customer_wallet_only
        funding_confirmed:
          type: boolean
          const: false
          description: record_funding_submission_v2 only; submission does not confirm funding
        evaluation_available:
          type: boolean
          const: false
          description: record_funding_submission_v2 only; await authoritative confirmation
    VirtualsAcpBindJobRequest:
