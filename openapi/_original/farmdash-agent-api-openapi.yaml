openapi: 3.1.0
info:
  title: FarmDash Agent API
  version: 2.0.0
  description: |
    WARNING: Running trade executions and cancellations places real perpetual futures trades and alters active market exposure, carrying significant risk of financial loss. Immediate, explicit manual end-user confirmation and consent is strictly required immediately before placing any execution or cancellation request. Do not allow autonomous agents to auto-run trade execution or cancellation without manual user approval.

    FarmDash is an intelligence and control layer for DeFi agents and serious airdrop farmers. This API covers swap transaction preparation (Signal Architect),
    protocol discovery intelligence (Trail Heat), perpetual futures (Futures Strategist), portfolio
    research, bounded autonomous sessions, x402 payment flows, and agent-readable opportunity intelligence.

    FarmDash does not request seed phrases or raw wallet private keys. Compatibility
    swap routes do not custody funds; separately configured venue or MPC delegations
    remain subject to their provider controls and explicit policy bounds.

    ## Authentication & Credential Lifecycle
    | Tier | Price | Auth | Rate Limit | Key Prefix | Entitlements | Best for |
    |------|-------|------|------------|------------|--------------|----------|
    | Scout | Free | None | 30 req / 24 h per IP | `fd_scout_free` | Keyless public discovery and quotes | Keyless discovery and quotes |
    | Pioneer | $39.99/mo USDC | `Authorization: Bearer <KEY>` | 1,500 req / day | `fd_pio_` | Premium research, full Trail Heat, wallet analytics, sybil audits | Serious farmers, full datasets, sybil audits, wallet analytics |
    | Syndicate | $199/mo USDC | `Authorization: Bearer <KEY>` | 50,000 req / day | `fd_syn_` | All Pioneer features plus advanced control tooling, bounded autopilot, webhooks, unrestricted CORS | Teams, serious agents, high-volume API use, webhooks, unrestricted CORS, advanced control/session tooling |

    ### Paid Entitlement & Key Issuance Sequence:
    1. **Pay**: Transfer USDC ($39.99/mo for Pioneer, $199/mo for Syndicate) on Base, Arbitrum, Optimism, Polygon, Ethereum, or Linea to the FarmDash treasury.
    2. **Verify**: Post transaction hash and wallet to `verify-payment` to record on-chain confirmation in `users` and `payment_events`.
    3. **Sign Proof**: Sign an EIP-712 `ApiKeyRequest` with the paying wallet (domain: `FarmDash`, intent: `Issue FarmDash API key`, single-use `nonce`).
    4. **Receive Credential**: Post the signed payload to `/api/v1/agent/api-key`. The credential tier is server-authoritative, derived exclusively from your active paid subscription (client input cannot downgrade or elevate your tier). The plaintext key is returned exactly once; FarmDash stores only a SHA-256 hash.
    5. **Authenticate**: Send `Authorization: Bearer <KEY>` on all requests. Daily limits reset every 24 hours (`X-RateLimit-Remaining`). Keys expire with your 30-day subscription; expired keys return HTTP 402 Payment Required. Higher-tier Syndicate capabilities (`advanced_control`) remain blocked for Pioneer subscribers.

    For SDK development without live data, use the deterministic sandbox on
    the two endpoints that explicitly support it (`/v1/agent/protocols` and
    `/v1/trail-heat`):
    `?mock=true`, `X-FarmDash-Mock: true`, or `Authorization: Bearer fd_sandbox_mock`
    Quote mock requests return typed `mock_not_supported` without contacting a live provider.

    Swap execution requires a fresh successful preflight simulation plus an EIP-191 agent wallet signature.
    Futures execution requires an EIP-712 Hyperliquid wallet signature.

    ## Dust Storm Protocol
    On upstream failure, FarmDash returns `ok:false` with a typed degraded state
    and a `warnings` array containing `{ kind: "dust_storm", message: "..." }`.
    Cached SDK responses may be returned as stale with explicit stale-data age.

    ## x402 Payment Wall
    When Scout limits are exceeded, FarmDash returns HTTP 402 with
    `code: free_quota_exhausted`, `instruction: STOP_RETRYING`, the UTC reset time,
    upgrade URL, and x402 payment instructions. Repeating the same unpaid request does
    not restore access and continued automated retries may result in temporary or
    permanent blocking. To unlock one additional request, send
    `X-Payment-Proof: 0x<txHash>` (or the x402 `PAYMENT-SIGNATURE`) for the
    route-specific USDC payment. The configured default overage is 0.01 USDC;
    premium routes return their own amount.

    ## Data Confidence
    Agent-facing research responses include `data_quality` and `scoring_methodology`
    where available. Trail Heat is a transparent heuristic, not a guaranteed yield,
    allocation, or airdrop outcome.

    ## Rate Limit Headers
    All responses include:
    - `X-RateLimit-Limit` — max requests for the current window
    - `X-RateLimit-Remaining` — remaining requests
    - `X-RateLimit-Reset` — UTC epoch seconds when the window resets
    - `X-Request-ID` — unique request trace ID (echo it for support)

    ## Versioned Signature Payload (v1)
    `v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}:{nonce}`
    Canonicalization is mandatory: lowercase every `0x`-prefixed field before joining, including
    token contract addresses as well as agent/destination addresses. Sign the exact resulting UTF-8
    string with EIP-191/personal_sign. A 428 simulation-gate response occurs before signature
    verification and therefore does not prove a signature is valid.

    ## Mandatory Swap Simulation Gate
    Do not use discovery GET `/agents/quote` to create execution state. POST
    `/v1/agent/quote-intent` with exact parameters, real wallet and idempotency key. Its top-level
    `intentId` is a `qi_*` quote-cache/idempotency identity; simulate with the separate
    `simulationRequirements.intent_id` (`fd_intent_*`). Then POST `/v1/simulate` with that
    `fd_intent_*` and wallet before calling `/agents/swap`.
    OpenAPI paths are relative to `https://www.farmdash.one/api`: `/agents/quote` means
    `https://www.farmdash.one/api/agents/quote`.
    For LI.FI native ETH routes, use the zero-address token sentinel rather than the WETH contract.
    `/agents/swap` rejects missing, failed, expired, or mismatched simulations.
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT

servers:
  - url: https://www.farmdash.one/api
    description: Production

tags:
  - name: Swap
    description: Token swap quotes, execution, and confirmation
  - name: Intelligence
    description: Trail Heat protocol data and chain analytics
  - name: History
    description: Fee event history and revenue metrics
  - name: Research
    description: Futures market research — funding rates, technical indicators
  - name: Strategy
    description: Strategy analysis and position sizing
  - name: Execution
    description: Futures order execution and cancellation
  - name: Account
    description: Hyperliquid account state and risk management
  - name: Session
    description: Bounded session management
  - name: Delegation
    description: Hyperliquid wallet delegation
  - name: Risk
    description: Pre-trade risk analysis, alerts, and execution guardrails
  - name: Autopilot
    description: Policy-bounded loop configuration and execution

x-agent-use-cases:
  - id: bounded-autopilot
    name: Bounded Autopilot
    tier: Syndicate
    cadence: Every 5 minutes
    purpose: Run an always-on loop inside explicit budgets, allowlists, cooldowns, quote freshness, and local-signing requirements.
    primaryTools: [agent_onboard, create_session, configure_autopilot, autopilot_cycle, session_heartbeat]
    stopConditions:
      - Budget, allowlist, cooldown, quote freshness, or risk bound is violated.
      - Required local EIP-191 or EIP-712 signature is missing.
      - Realized performance degrades enough to require analysis_only mode.
  - id: airdrop-rotation
    name: Airdrop Rotation Desk
    tier: Pioneer
    cadence: Daily or event-driven
    purpose: Watch Trail Heat, snapshots, multiplier changes, wallet health, and costs before entering, waiting, rotating, or exiting.
    primaryTools: [get_trail_heat, get_historical_trailheat, get_agent_events, simulate_points, get_swap_quote, simulate_swap_execution]
    stopConditions:
      - Expected point edge is unclear or negative after fees and gas.
      - Sybil risk exceeds the configured threshold.
      - User constraints do not allow the target chain or protocol.
  - id: cross-chain-roi
    name: Cross-Chain ROI Gate
    tier: Pioneer
    cadence: Before any bridge
    purpose: Bridge only when net expected edge remains positive after bridge fee, gas, slippage, and execution risk buffer.
    primaryTools: [get_chain_breakdown, get_wallet_balances, get_token_prices, get_swap_quote, simulate_swap_execution, optimize_portfolio]
    stopConditions:
      - netEdgeUsd is not positive.
      - Quote age exceeds the configured freshness limit.
      - Target chain is not allowlisted.
  - id: perps-hedge
    name: Perps Hedge Co-Pilot
    tier: Syndicate
    cadence: Before exposure changes
    purpose: Evaluate whether a farming position needs a Hyperliquid hedge, with no_trade as a valid outcome.
    primaryTools: [scan_funding_rates, scan_market_conditions, get_futures_account, analyze_futures_strategy, calculate_position_size]
    stopConditions:
      - Research gate expires.
      - Strategy confidence, liquidity, jurisdiction, or guardrails do not support execution.
      - Daily loss or drawdown limit is reached.

# ═══════════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════════

paths:

  /api/status:
    get:
      operationId: getPublicSystemStatus
      summary: Get authoritative public system status and agent capability contract
      description: |
        Returns the real-time operational status of all 9 Trail Stack lifecycle stages,
        core infrastructure, and venue execution capabilities (e.g. EVM swaps LIVE,
        Hyperliquid perps LIVE, generic intents PREPARATION ONLY, Solana DISCOVERY ONLY).
        Zero authentication required. Autonomous AI agents can query this before
        initiating transactions.
      tags: [Intelligence]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Public system status and capability contract
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Major system outage detected

  /v1/agent/billing-history:
    get:
      operationId: getBillingHistory
      summary: Get your subscription state and payment history
      description: |
        Billing-portal-lite for paid agents. Requires a stored Pioneer or
        Syndicate API key (the key is bound to the paying wallet). Returns the
        current subscription state (tier, expiry, auto_renew=false — prepaid
        30-day terms) plus the append-only payment ledger: one row per
        verified on-chain USDC payment, newest first. Renewals append rows;
        history is never overwritten.
      tags: [Account]
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Subscription state and payment ledger
          content:
            application/json:
              schema:
                type: object
                required: [ok, wallet, subscription, payments]
                properties:
                  ok: { type: boolean }
                  wallet: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
                  subscription:
                    type: object
                    properties:
                      tier: { type: string, nullable: true }
                      expires_at: { type: string, format: date-time, nullable: true }
                      active: { type: boolean }
                      auto_renew: { type: boolean }
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        tier: { type: string, nullable: true }
                        amount_usdc: { type: number, nullable: true }
                        tx_hash: { type: string, nullable: true }
                        chain_id: { type: integer, nullable: true }
                        verified_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
        '402':
          description: Payment required (free tier has no billing history)
        '403':
          description: Pioneer or Syndicate subscription required
        '503':
          description: Billing ledger temporarily unavailable

  /v1/agent/status:
    get:
      operationId: getAgentStatus
      summary: Get agent feature status and contracts
      description: |
        Public status endpoint for agent builders. Returns feature readiness,
        tier gates, data-confidence contract, structured-error contract, and
        deterministic sandbox instructions. This endpoint is not a trading or
        portfolio-data surface.
      tags: [Intelligence]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Agent status contract
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '405':
          $ref: '#/components/responses/BadRequest'

  # ── Swap ────────────────────────────────────────────────────────

  /agents/quote:
    get:
      operationId: getSwapQuote
      summary: Get a token swap quote
      description: |
        Provider-neutral market estimate by default: returns an explicitly
        labelled `market_estimate` (reference price, approximate output,
        server fee tier, route compatibility, freshness) WITHOUT calling 0x,
        LI.FI, or Relay trading APIs. Browsing, polling, previews, and
        wallet-supplied GETs all receive estimation — a `walletAddress` alone
        is exploratory context, never execution intent, and never fans out
        into provider APIs. The estimate is intelligence, not a provider
        quote: no executable calldata, no provider attribution, no liquidity
        confirmation, never `executionReady: true`.
        For execution, POST `/v1/agent/quote-intent` with exact parameters, a
        real wallet, and an idempotency key to receive a firm single-provider
        quote bound to an `intentId`; then re-call this endpoint with the
        identical parameters plus `intentId` to serve the stored firm quote
        with zero new provider calls. Changed parameters never reuse a stale
        quote (`intent_params_changed`); unknown/expired intents return
        `intent_not_found`. One intent contacts exactly one primary provider;
        a sequential alternate follows only a genuine primary failure.
        0x quotes use the AllowanceHolder flow (standard approve + plain
        transaction); FarmDash does not support Permit2 EIP-712 signatures.
        `mock=true` is not supported and returns a typed 400 without contacting a provider.
      tags: [Swap]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - $ref: '#/components/parameters/FromChainId'
        - $ref: '#/components/parameters/ToChainId'
        - $ref: '#/components/parameters/FromToken'
        - $ref: '#/components/parameters/ToToken'
        - $ref: '#/components/parameters/FromAmount'
        - name: protocol
          in: query
          schema:
            type: string
            enum: [lifi, relay]
          description: Force a specific routing protocol (auto-selected if omitted)
        - name: mock
          in: query
          schema:
            type: string
            enum: ['true']
          description: Unsupported for quotes. Returns HTTP 400 mock_not_supported and never contacts a live quote provider.
        - name: walletAddress
          in: query
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Optional real wallet. Exploratory context only — a wallet alone never triggers provider quoting. For execution, POST /api/v1/agent/quote-intent.
        - name: toAddress
          in: query
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Optional destination wallet override. Must exactly match the stored intent when serving via intentId.
        - name: slippage
          in: query
          schema:
            type: number
            minimum: 0.01
            maximum: 5
          description: Optional slippage tolerance in percent
        - name: expectedUpsideUsd
          in: query
          schema:
            type: number
          description: Optional upside estimate used to enforce positive net edge
        - name: riskBufferUsd
          in: query
          schema:
            type: number
          description: Optional execution-risk haircut added to total route cost
        - name: healthFactor
          in: query
          schema:
            type: number
          description: Optional health factor used for halt checks
        - name: liquidationBufferPct
          in: query
          schema:
            type: number
          description: Optional liquidation buffer percentage used for halt checks
        - name: safetyMode
          in: query
          schema:
            $ref: '#/components/schemas/SwapSafetyMode'
          description: "`strict` halts on severe quote decay, `balanced` downgrades that condition to a warning"
        - name: intentId
          in: query
          schema:
            type: string
          description: Execution-intent ID from POST /api/v1/agent/quote-intent. Serves the stored firm quote with zero new provider calls when all other parameters exactly match the intent; mismatches return intent_params_changed, unknown IDs return intent_not_found.
      responses:
        '200':
          description: Swap quote
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MarketEstimateResponse'
                  - $ref: '#/components/schemas/FirmQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          description: Unknown/expired intentId (intent_not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Typed live quote provider degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '504':
          $ref: '#/components/responses/ProviderTimeout'

  /v1/agent/market-estimate:
    get:
      operationId: getMarketEstimate
      summary: Get a provider-neutral market estimate
      description: |
        Discovery intelligence for browsing, previews, polling, and walletless
        exploration. Returns an explicitly labelled market_estimate (reference
        price, approximate output, server fee tier, route compatibility,
        freshness) WITHOUT calling 0x, LI.FI, or Relay trading APIs. Never
        executable, never attributed, never liquidity-confirmed. For
        execution, POST /v1/agent/quote-intent.
      tags: [Swap]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - $ref: '#/components/parameters/FromChainId'
        - $ref: '#/components/parameters/ToChainId'
        - $ref: '#/components/parameters/FromToken'
        - $ref: '#/components/parameters/ToToken'
        - $ref: '#/components/parameters/FromAmount'
      responses:
        '200':
          description: Market estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketEstimateResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/agent/quote-intent:
    post:
      operationId: createQuoteIntent
      summary: Create an execution intent with a firm single-provider quote
      description: |
        Explicit execution intent. Requires exact chain pair, token pair,
        amount, real wallet/taker, destination, slippage, and a client
        idempotency key; the fee tier is resolved server-side before any
        provider call. One intent contacts exactly one primary provider; a
        sequential alternate follows only a genuine primary failure.
        Identical intents reuse the stored firm quote (HTTP 200 reused:true);
        changed parameters never reuse a stale quote. The firm quote flows
        through simulate, approval, and prepare without further provider
        quote requests. Quote is not execution; FarmDash never signs or
        broadcasts.
        Provider prerequisites (compatibility swaps):
        A firm quote reports readiness plus any provider prerequisite that must be
        satisfied before simulation. A prerequisite recipe is NOT an executable swap
        transaction and must never be passed directly into simulation.

        LI.FI: when approval.required is true, approval.spender is the spender
        FarmDash observed. FarmDash does not build or broadcast the ERC-20 approval
        transaction: the customer-controlled wallet must satisfy the ERC-20 allowance
        locally (standard approve(spender, amount)), wait for that transaction to
        confirm, then request a FRESH firm quote so FarmDash re-checks the wallet
        balance and allowance. Proceed only when executionReady is true. The zero
        address 0x0000000000000000000000000000000000000000 is the LI.FI native-token
        sentinel and requires no ERC-20 allowance; it is not WETH.

        Relay: providerExecutionPlan is an ORDERED recipe whose steps have kind
        approve, transaction, signature or unknown, and carry status, to, data,
        value and chainId; approve steps also carry approvalSpender and
        approvalAmount, and signature steps carry signatureKind with sign/post/check.
        Follow planContinuation: "re_quote_after_approval" means complete the
        approval locally then obtain a fresh quote;
        "execute_provider_plan_and_check" means execute the ordered sign/post/check
        recipe exactly as returned; "provider_recipe_unsupported" means stop and do
        not treat the recipe as executable. A required step of kind unknown remains
        blocking. Never flatten a multi-step recipe into its first transaction.
        When a value is unreadable FarmDash reports unknown rather than assuming the
        prerequisite is satisfied. Prerequisite completion is not settlement.
      tags: [Swap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromChainId, toChainId, fromToken, toToken, fromAmount, walletAddress, toAddress, slippage, idempotencyKey]
              properties:
                fromChainId: { type: integer }
                toChainId: { type: integer }
                fromToken: { type: string }
                toToken: { type: string }
                fromAmount: { type: string }
                walletAddress: { type: string }
                toAddress: { type: string }
                slippage: { type: number, minimum: 0.01, maximum: 5 }
                protocol: { type: string, enum: [lifi, relay] }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: Firm quote bound to a new execution intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmQuoteResponse' }
        '200':
          description: Stored firm quote reused for an identical intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmQuoteResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: This idempotencyKey was already used for a materially different request (idempotency_conflict). Generate a new key for a new logical swap; retrying the same key never merges them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Request body too large. Execution-facing bodies are capped at 32 KB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Typed live quote provider degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /agents/solana-quote:
    get:
      operationId: getSolanaQuotePreview
      summary: Get a read-only Solana swap quote preview
      description: |
        Returns explicitly non-authoritative Solana pricing intelligence via Jupiter. No authentication required.
        PREVIEW ONLY: the response cannot be executed through the compatibility swap API (Solana execution
        remains preview in the capability registry until an authoritative simulation adapter, Solana signing
        flow, receipt binding, and mainnet integration tests land). FarmDash never signs, builds, or broadcasts
        a transaction from this route.
        `mock=true` is not supported and returns a typed 400 without contacting a provider.
      tags: [Swap]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: inputMint
          in: query
          required: true
          schema:
            type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
          description: Input token mint (base58 Solana address)
        - name: outputMint
          in: query
          required: true
          schema:
            type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
          description: Output token mint (base58 Solana address)
        - name: amount
          in: query
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Input amount as a canonical base-unit integer string (no leading zeros)
        - name: slippageBps
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Optional slippage tolerance in basis points (default 50)
        - name: mock
          in: query
          schema:
            type: string
            enum: ['true']
          description: Unsupported for previews. Returns HTTP 400 mock_not_supported and never contacts a live quote provider.
      responses:
        '200':
          description: Non-authoritative Solana quote preview
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required: [ok, preview_only, authoritative, submissionAvailable, source, inputMint, outputMint, inAmount, outAmount]
                properties:
                  ok: { type: boolean }
                  preview_only: { type: boolean }
                  authoritative: { type: boolean }
                  submissionAvailable: { type: boolean }
                  source: { type: string }
                  inputMint: { type: string }
                  outputMint: { type: string }
                  inAmount: { type: string }
                  outAmount: { type: string }
                  priceImpactPct: { type: string, nullable: true }
                  routeHops: { type: integer, nullable: true }
                  quotedAt: { type: string, format: date-time }
                  unsigned: { type: boolean }
                  broadcast_by_farmdash: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          description: Typed Jupiter preview degradation (dust-storm contract)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '504':
          description: Jupiter preview timed out (dust-storm contract, retryable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/simulate:
    post:
      operationId: simulateSwapExecution
      summary: Simulate a wallet-bound swap intent
      description: |
        Mandatory pre-execution simulation gate for Signal Architect. The caller
        submits `simulationRequirements.intent_id` (`fd_intent_*`) returned by
        `POST /v1/agent/quote-intent` plus the signing wallet. Do not submit the
        top-level `intentId` (`qi_*`), which is the quote-cache/idempotency identity.
        FarmDash simulates the bound execution intent, caches the result for 60 seconds,
        and returns a `simulation_id` that `/agents/swap` requires.
      tags: [Swap, Risk]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapSimulationRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Simulation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapSimulationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Intent and wallet mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /agents/swap:
    post:
      operationId: executeSwap
      summary: Prepare a signed compatibility-swap transaction
      description: |
        Compatibility transaction-preparation endpoint. It requires a fresh successful
        `simulationId`, authenticates the customer wallet with EIP-191, validates the released
        provider boundary, and returns the exact prepared transaction payload.

        FarmDash does not broadcast the returned compatibility-swap transaction. The customer
        wallet signs and submits the transaction directly to the target network. The chosen
        aggregator or router protocol (automatic multi-provider routing:
        same-chain LI.FI + Relay; cross-chain LI.FI + Relay; 0x is operator-paused
        until reinstated and is never primary or fallback)
        executes the swap.

        **Signature canonicalization**: construct
        `v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}:{nonce}`
        after lowercasing every `0x`-prefixed field, including token addresses. Sign the exact
        UTF-8 string with EIP-191/personal_sign. A 428 simulation-gate response is evaluated before
        signature verification and does not prove the signature is valid.

        For LI.FI native ETH routes use the zero-address native-token sentinel, not the WETH contract.

        **Fee schedule** (combined routing target; LI.FI 25 bps platform component deducted, not stacked; gas/slippage excluded): 50 bps under $10k, 45 bps at $10k+, 40 bps at $100k+, 30 bps at $1M+.
      tags: [Swap]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Executable swap with transaction calldata
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid signature or expired nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Swap halted by Risk Sentinel guardrails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapHaltResponse'
        '428':
          description: Missing, expired, failed, or mismatched preflight simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /agents/confirm:
    post:
      operationId: confirmSwap
      summary: Confirm swap execution with on-chain tx hash
      description: |
        After broadcasting the swap transaction, confirm it here with the tx hash.
        FarmDash verifies the transaction on-chain (10s timeout with LRU cache)
        and marks the fee event as settled. Idempotent — safe to retry.
      tags: [Swap]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Confirmation result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '400':
          description: Malformed or invalid confirmation input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or malformed session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Ownership or token authorization failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Settlement conflict. Either the exact expected fee transfer failed verification, or the fee event was already confirmed using a DIFFERENT transaction hash (code already_confirmed_conflict). In the latter case the existing settlement is NOT replaced, and this is not a retry-with-the-new-hash condition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: >-
            Unexpected internal confirmation failure (typed dust_storm). Settlement was not recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── History ─────────────────────────────────────────────────────

  /agents/history:
    get:
      operationId: getSwapHistory
      summary: Get your own fee event history (tenant-bound)
      description: |
        Returns paginated swap fee events owned by the wallet bound to your
        API key. Requires a Pioneer or Syndicate bearer key; anonymous and
        scout callers receive 401 authentication_required. The query is
        always forced to the authenticated wallet — any `agentAddress` that
        differs from it returns 403 cross_tenant_denied.
        Use `?metrics=true` for aggregate revenue metrics for your own wallet.
        For the public leaderboard view (server-aggregated totals only, no
        raw transactions), use GET /v1/agent/leaderboard.
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: agentAddress
          in: query
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Optional. Must equal the wallet bound to your API key; any other value is rejected with 403 cross_tenant_denied.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            maximum: 10000
          description: Pagination offset (capped at 10,000 for DoS protection)
        - name: metrics
          in: query
          schema:
            type: string
            enum: ['true']
          description: Return aggregate revenue metrics (own wallet only) instead of events
      responses:
        '200':
          description: History events or aggregate metrics
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HistoryResponse'
                  - $ref: '#/components/schemas/RevenueMetrics'
        '401':
          description: Authentication required — bind a Pioneer/Syndicate API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-tenant denial — agentAddress does not match the authenticated wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  # ── Reputation (public Trail Cred) ───────────────────────────────

  /agents/reputation:
    get:
      operationId: getAgentReputation
      summary: Public single-address reputation lookup (Trail Cred)
      description: |
        Trail Cred score, badge, vouch count, on-chain score, and recent
        vouchers for one EVM address, plus a swap-activity summary. Public
        data beyond rate-limiting tiers; over-quota Scouts draw first from a
        small overflow bonus pool shared with the leaderboard (bonus 200s
        carry `scout_bonus` and X-Scout-Bonus-Remaining), then 402.
      tags: [Reputation]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: address
          in: query
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: EVM agent address to look up.
        - name: voucher
          in: query
          required: false
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: Optional voucher address; response includes whether it vouched for the target.
      responses:
        '200':
          description: Reputation record for the address
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Scout-Bonus-Remaining:
              $ref: '#/components/headers/X-Scout-Bonus-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationResponse'
        '400':
          description: Missing or invalid ?address parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  # ── Leaderboard (public aggregates) ─────────────────────────────

  /v1/agent/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Public leaderboard — server-aggregated per-agent totals
      description: |
        Per-agent aggregate totals (volume, fees, swap count) ranked by
        volume, top 50. Computed server-side over fee_events; returns
        aggregates ONLY — no raw transactions, tx hashes, or per-event
        timestamps. No API key required beyond rate-limiting tiers.
      tags: [History]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Aggregated leaderboard entries
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/balances:
    get:
      operationId: getWalletBalances
      summary: Multi-chain wallet balance context for an agent address
      description: |
        Read-only multi-chain token balance context used to ground
        recommendations in the caller's actual wallet state. The queried
        address must match the authenticated tenant wallet when a bound
        API key is presented. Balances are directional reads, not custody.
      tags: [Wallet]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: address
          in: query
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: EVM wallet address.
        - name: chains
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated chain filter.
        - name: summary
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: Return the compact summary form.
      responses:
        '200':
          description: Wallet balance context (labeled estimates; no custody)
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Queried address does not match the bound tenant wallet.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/performance:
    get:
      operationId: getAgentPerformance
      summary: Agent performance and protocol breakdown
      description: |
        Fee-event activity aggregates for the authenticated agent address:
        cumulative volume, fees, and protocol diversity context. It is not a
        fill-quality ledger; profitability cannot be inferred from it.
      tags: [History]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: address
          in: query
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: EVM agent/wallet address (must match bound tenant wallet when a key is presented).
      responses:
        '200':
          description: Aggregate performance context
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Queried address does not match the bound tenant wallet.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/sybil-audit:
    get:
      operationId: getSybilAudit
      summary: Wallet-cluster Sybil risk scoring (1-10 EVM addresses)
      description: |
        Heuristic defensive audit for timing clusters, shared funding,
        internal transfers, low diversity, and bot-like wallet patterns.
        This is a risk-management signal, NOT a protocol eligibility verdict:
        never call a low score "clean" and never prescribe activity designed
        to change detection outcomes.
      tags: [Risk]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: addresses
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated EVM addresses (max 10; case-insensitive dedupe).
      responses:
        '200':
          description: Per-wallet Sybil risk findings with data-quality caveats
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/simulate-points:
    post:
      operationId: simulatePoints
      summary: FarmScore and points projection simulation
      description: |
        Projects FarmScore for a farming configuration so agents can compare
        projected points-per-dollar across protocols. Simulations are
        decision-support estimates, not guarantees.
      tags: [Planning]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totalVolumeUsd: { type: number }
                protocolPoints: { type: object }
                txCount: { type: integer }
                daysActive: { type: integer }
                isCexFundingOnly: { type: boolean }
      responses:
        '200':
          description: Projected FarmScore and per-protocol points comparison
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/optimize-portfolio:
    post:
      operationId: optimizePortfolio
      summary: Portfolio optimization context
      description: |
        Personalized protocol-allocation recommendations based on current
        positions, budget, and risk preference. Planning output only — it
        does not authorize or execute any transaction.
      tags: [Planning]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget: { type: number }
                chains: { type: array, items: { type: string } }
                currentProtocols: { type: array, items: { type: string } }
                riskPreference: { type: string }
      responses:
        '200':
          description: Ordered allocation recommendations with rationale
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  # ── Intelligence ────────────────────────────────────────────────

  /v1/agent/protocols:
    get:
      operationId: getProtocolCatalog
      summary: Get catalog protocol directory (discovery heuristic scores)
      description: |
        Returns the curated FarmDash protocol catalog with EDITORIAL discovery
        heuristic scores. These are NOT live Trail Heat: values derive from
        static catalog TVL strings, status labels and hand-curated flags
        (methodology catalog-editorial-v1). The canonical quantitative Trail
        Scout tier: top 3 spotlight protocols with 100% unmasked quantitative scores (30 req/day).
        Pioneer/Syndicate: full dataset for the current FarmDash protocol registry (81 protocols at this build).
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Protocol dataset
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolsResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/trail-heat:
    get:
      operationId: getLiveTrailHeat
      summary: Get live or deterministic mock Trail Heat scores
      description: |
        Returns DeFiLlama-backed Trail Heat scores with source, confidence, and
        methodology metadata. Aggregate responses also include agent recommendations
        derived from the same live scores. Commercial preference is transparent:
        FarmDash referral routes may move ahead only inside a 5-point Trail Heat
        quality band; materially stronger protocols always win and canonical scores
        are never changed. Campaign activity/eligibility is not inferred from protocol
        activity. Pioneer/Syndicate callers can use `?recommend=N` for a recommendation-only
        response; Scout callers continue to receive the bounded three-protocol spotlight preview
        with recommendations limited to that preview. `?mock=true` returns deterministic demo fixtures that are explicitly marked
        mock and not for trading.
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: mock
          in: query
          schema: { type: string, enum: ['true'] }
          description: Return deterministic, explicitly non-live demo data.
        - name: recommend
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: Pioneer/Syndicate only — return N live protocol recommendations. Scout remains bounded to its three-protocol spotlight preview. Canonical Trail Heat is the primary signal; only owner-confirmed, non-wallet-bound FarmDash referral routes are eligible for the near-equivalent-quality tiebreaker.
      responses:
        '200':
          description: Live or deterministic mock Trail Heat response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          description: Invalid API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          description: Typed Trail Heat service degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/agent/prices:
    get:
      operationId: getTokenPrices
      summary: Get live token price context
      description: Returns live Alchemy USD prices. Provider failure is a typed ok:false degraded response, never a successful empty or zero price set.
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: symbols
          in: query
          schema: { type: string, example: 'ETH,USDC' }
          description: Comma-separated token symbols; provide symbols or tokens.
        - name: tokens
          in: query
          schema: { type: string, example: 'base-mainnet:0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913' }
          description: Comma-separated network:address pairs; provide symbols or tokens.
      responses:
        '200':
          description: Live token prices with explicit data quality
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Typed upstream price degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Price provider is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/agent/workflows:
    get:
      operationId: listAgentWorkflows
      summary: List supervised workflow templates
      description: Public catalog of planning and supervised workflow templates. Catalog registration does not enable the execution capabilities used by a workflow.
      tags: [Intelligence]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: filter
          in: query
          schema: { type: string }
          description: Optional case-insensitive catalog filter.
      responses:
        '200':
          description: Workflow catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /v1/agent/chain-breakdown:
    get:
      operationId: getChainBreakdown
      summary: Get protocol distribution by chain
      description: |
        Aggregates the protocol directory by blockchain network.
        Returns per-chain protocol counts, confirmed airdrops, points programs,
        and category coverage.
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Chain breakdown
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainBreakdownResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  # ── Futures Research ────────────────────────────────────────────

  /v1/agent/futures/scan-funding:
