      responses:
        '200':
          description: Funding rate scan
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanFundingResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Typed Hyperliquid funding provider degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/agent/futures/market-conditions:
    get:
      operationId: getMarketConditions
      summary: Get technical indicators for an asset
      description: |
        Returns EMA-8/34, RSI-14, MACD(12,26,9), ATR-14, Bollinger Bands(20,2),
        ADX-14, volume ratio, and Z-score using 4h candles.
        Includes a strategy hint based on indicator confluence.
      tags: [Research]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: coin
          in: query
          required: true
          schema:
            type: string
          description: Asset symbol (ETH, BTC, SOL, HYPE)
      responses:
        '200':
          description: Technical indicators
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketConditionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '502':
          description: Typed Hyperliquid candle provider degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/agent/futures/account-state:
    get:
      operationId: getAccountState
      summary: Get Hyperliquid positions and risk state
      description: |
        Returns the agent's current positions, margin summary, equity,
        liquidation prices, and risk management state. Daily/weekly values are
        conservative loss-pressure metrics (rolling closed PnL minus absolute
        fill fees plus funding and negative current unrealized PnL only), not
        full period returns.
        Read-only lookup — no private key required.
      tags: [Account]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: agentAddress
          in: query
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Agent's EVM address (Hyperliquid API wallet)
      responses:
        '200':
          description: Account state with risk info
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  # ── Futures Strategy ────────────────────────────────────────────

  /v1/agent/futures/analyze-strategy:
    post:
      operationId: analyzeStrategy
      summary: Full research pipeline with adaptive strategy recommendation
      description: |
        Runs funding rates + technicals + order book liquidity + Trail Heat cross-ref.
        Returns a structured strategy object, confidence score, market regime,
        adaptive risk, portfolio context, pre-trade simulation, and explicit
        no-trade outcomes when no setup is valid. Pioneer+ required and
        registers analysis for a 60-second execution window that binds side, maximum size, entry drift, leverage metadata, and stop-derived risk.
      tags: [Strategy]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coin, agentAddress]
              properties:
                coin:
                  type: string
                  description: Asset symbol (ETH, BTC, SOL)
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                riskMultiplier:
                  type: number
                  minimum: 0.1
                  maximum: 1.0
                  description: Optional flexibility modifier for risk tolerance. 1.0 keeps the full risk budget; lower values are more conservative.
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Strategy recommendation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeStrategyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  /v1/agent/futures/position-sizing:
    post:
      operationId: calculatePositionSize
      summary: Position size calculator with guardrail enforcement
      description: |
        Given entry price, stop price, equity, and risk, returns exact position
        size, leverage, and margin. All guardrails enforced server-side.
        Pioneer+ required.
      tags: [Strategy]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionSizingRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Position sizing result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSizingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  # ── Futures Execution ───────────────────────────────────────────

  /v1/agent/futures/execute-order:
    post:
      operationId: executeOrder
      summary: Execute a pre-signed order on Hyperliquid
      description: |
        Forwards a pre-signed EIP-712 order to Hyperliquid. Requires prior
        execution-ready analyze-strategy call within 60 seconds (parameter-bound research gate). Syndicate only.
        FarmDash may receive routing compensation from supported venues. Risk guardrails enforced server-side.
        `nonce`, `expiresAt`, and `intentHash` are required for request-scoped
        expiry and auditability. `expiresAt` is forwarded as venue `expiresAfter`.
        `market_ioc` is a signed, price-protected IOC limit order with a live 100
        bps adverse-price cap, never an unbounded market order. It distinguishes
        full, partial, and zero fill; an IOC resting response is unknown/inconsistent.
        Venue nonce authority is `network + signer + nonce` across account and vault
        contexts. Durable replay control fails closed before submission.
        The signed order action discloses FarmDash builder `f=1`, which means
        0.1 bp (0.001%) of filled notional—not 1 bp. Resting/rejected/unfilled
        notional is not fee-bearing volume.
        WARNING: This endpoint initiates real perpetual futures trades on Hyperliquid which can lead to substantial financial loss. You must explicitly present all trade details, fees, and leverage levels to the user, and obtain their manual confirmation prior to calling this endpoint. Never automate or auto-run this endpoint.

      tags: [Execution]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteOrderRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Order execution result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteOrderResponse'
        '400':
          description: Risk check failed or research not performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  /v1/agent/futures/cancel-order:
    post:
      operationId: cancelOrder
      summary: Cancel open Hyperliquid orders
      description: |
        Cancels one or more open orders (max 50 per request).
        Scout capacity is available inside the shared 30 requests / 24h quota; Pioneer is capped at 1,500/day and Syndicate at 50,000/day. The returned entitlement and rate-limit state is authoritative. EIP-712 signature is required on every request.
        Required `expiresAt` is forwarded as venue `expiresAfter`; required
        `intentHash` binds the FarmDash request for auditability.
        HTTP 202 is returned only for `accepted` application acknowledgement, not final venue cancellation.
        Reconcile every requested ID through `/api/v1/agent/futures/reconcile-order`
        before dependent action. Venue nonce authority is `network + signer + nonce`
        across account and vault contexts; durable replay control fails closed before submission.
        WARNING: This endpoint alters active market state and cancels protective orders. Ensure the user has explicitly confirmed the action and understands the resulting exposure change before calling this endpoint. Never automate or auto-run this endpoint.

      tags: [Execution]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '202':
          description: Cancellation application acknowledgement; final venue cancellation requires reconciliation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  # ── Autonomous Operator ─────────────────────────────────────────

  /v1/agent/onboard:
    get:
      operationId: getOnboardingGuide
      summary: Get bounded agent onboarding guide
      description: |
        Returns setup checklist, capability map, security model, and workflow loop.
        No auth required — entry point for new agents.
      tags: [Session]
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Onboarding guide
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardResponse'

  /v1/agent/authority:
    get:
      operationId: getExecutionAuthority
      summary: Get current execution authority configuration and bounded delegation status
      description: |
        Returns the dual execution-authority state (USER_SIGNED vs BOUNDED_AUTONOMOUS),
        zero-custody confirmation, and active delegation status if configured.
      tags: [ExecutionAuthority]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: ownerAddress
          in: query
          required: false
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Authority discovery or active grant summary
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required: [ok, mode, supportedModes, autonomousAvailable, executionRole, signingAuthority, zeroCustody]
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                    enum: [USER_SIGNED, BOUNDED_AUTONOMOUS]
                  supportedModes:
                    type: array
                    items:
                      type: string
                  autonomousAvailable:
                    type: boolean
                  executionRole:
                    type: string
                  signingAuthority:
                    type: string
                  zeroCustody:
                    type: boolean
                  grant:
                    type: object
                    nullable: true
                  nextAction:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: manageExecutionAuthority
      summary: Request delegation payload, register delegation, prepare autonomous swap, confirm swap, or revoke authority
      description: |
        Dual execution authority management. Actions: get_authority, request_delegation,
        register_delegation, prepare_autonomous_swap, confirm_autonomous_swap, revoke.
        Zero key custody: calling agent local signer retains wallet authority.
      tags: [ExecutionAuthority]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [get_authority, status, request_delegation, register_delegation, prepare_autonomous_swap, confirm_autonomous_swap, revoke]
                ownerAddress:
                  type: string
                sessionId:
                  type: string
                grantId:
                  type: string
      responses:
        '200':
          description: Authority operation success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Policy violation or structured authority rejection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  details:
                    type: object

  /v1/agent/session:
    get:
      operationId: findSession
      summary: Find active session for an agent
      tags: [Session]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: agentAddress
          in: query
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
      responses:
        '200':
          description: Session lookup result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/AgentSession'
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: manageSession
      summary: Create, resume, heartbeat, or close a session
      description: |
        Multiplexed endpoint. Set `action` to one of:
        `create`, `resume`, `heartbeat`, `close`.
        `create` returns a one-time `sessionToken`. All mutating follow-up
        actions require `sessionId`, owning `agentAddress`, and `sessionToken`
        in the JSON body or the `X-FarmDash-Session-Token` header.
        Pioneer+ required.
      tags: [Session]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [create, resume, heartbeat, close]
                agentAddress:
                  type: string
                  description: Required for `create`, `resume`, `heartbeat`, and `close`
                sessionId:
                  type: string
                  description: Required for `resume`, `heartbeat`, `close`
                sessionToken:
                  type: string
                  description: Required for `resume`, `heartbeat`, and `close`; returned only once by `create`
                agentMeta:
                  $ref: '#/components/schemas/AgentMeta'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Session action result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/AgentSession'
                  sessionToken:
                    type: string
                    description: One-time session capability returned only when action is `create`
                  auth:
                    type: object
                    properties:
                      scheme: { type: string, enum: [session_capability_v1] }
                      header: { type: string, enum: [X-FarmDash-Session-Token] }
                      bodyField: { type: string, enum: [sessionToken] }
                      note: { type: string }
        '401':
          description: Missing or invalid session capability token
        '403':
          description: Session owner or token verification failed
        '402':
          $ref: '#/components/responses/PaymentRequired'

  /v1/agent/delegation:
    get:
      operationId: getDelegationStatus
      summary: Check delegation status
      tags: [Delegation]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: agentAddress
          in: query
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
      responses:
        '200':
          description: Delegation status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: verifyDelegation
      summary: Verify wallet delegation for bounded execution
      description: |
        The API wallet can trade but CANNOT withdraw — zero-custody preserved.
        When `sessionId` is supplied, `sessionToken` is required to attach the
        delegation to that session.
        Syndicate required.
      tags: [Delegation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentAddress, apiWalletAddress, ownerAddress]
              properties:
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                apiWalletAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                ownerAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                sessionId:
                  type: string
                sessionToken:
                  type: string
                  description: Required when `sessionId` is supplied
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Delegation verification result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'

  /v1/agent/autopilot:
    get:
      operationId: getRecommendedAutopilotConfig
      summary: Get recommended autopilot configuration
      tags: [Autopilot]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: equity
          in: query
          required: true
          schema:
            type: number
        - name: riskPreference
          in: query
          schema:
            type: string
            enum: [conservative, balanced, aggressive]
            default: balanced
      responses:
        '200':
          description: Recommended config
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  recommendedConfig:
                    type: object
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: manageAutopilot
      summary: Configure, run cycle, pause, or resume autopilot
      description: |
        Multiplexed endpoint. Set `action` to one of:
        `configure`, `cycle`, `pause`, `resume_autopilot`.
        All POST actions require `sessionId`, owning `agentAddress`, and
        `sessionToken` in the JSON body or `X-FarmDash-Session-Token` header.
        Syndicate required for configure/cycle/pause/resume.
      tags: [Autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, sessionId, agentAddress]
              properties:
                action:
                  type: string
                  enum: [configure, cycle, pause, resume_autopilot]
                sessionId:
                  type: string
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                sessionToken:
                  type: string
                  description: Session capability returned by `create`
                config:
                  $ref: '#/components/schemas/AutopilotConfig'
                accountState:
                  type: object
                  description: Required for `cycle` action
                  properties:
                    equity:
                      type: number
                    dailyPnlPct:
                      type: number
                    weeklyPnlPct:
                      type: number
                    drawdownPct:
                      type: number
                    openPositionCount:
                      type: integer
                    aggregateLeverage:
                      type: number
                    markPrices:
                      type: object
                      additionalProperties:
                        type: number
                    healthFactor:
                      type: number
                    liquidationBufferPct:
                      type: number
                    stablecoinDepegPct:
                      type: number
                    quoteDecayBps:
                      type: number
                    gasPerActionUsd:
                      type: number
                    rebalanceContext:
                      $ref: '#/components/schemas/RebalanceContext'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Autopilot action result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/AgentSession'
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutopilotAction'
                  riskStatus:
                    $ref: '#/components/schemas/AutopilotRiskStatus'
        '401':
          description: Missing or invalid session capability token
        '403':
          description: Session owner or token verification failed
        '402':
          $ref: '#/components/responses/PaymentRequired'

# ═══════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════

  /v1/agent/risk-sentinel:
    get:
      operationId: getRiskSentinelInfo
      summary: Describe Risk Sentinel usage
      description: |
        Returns a lightweight usage guide for the standalone risk-analysis endpoint.
        Use POST to inspect allowance state, token/bridge/contract risks, depeg checks,
        health-factor alerts, quote decay, and positive-net-edge enforcement.
      tags: [Risk]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Usage guide
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  description:
                    type: string
                  usage:
                    type: string
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: analyzeRiskSentinel
      summary: Analyze a route or account with Risk Sentinel
      description: |
        Accepts either a full swap-shaped payload or manual health/net-edge inputs.
        When swap fields are present, FarmDash auto-selects a route, computes
        Execution Alpha diagnostics, and returns a full Risk Sentinel report.
      tags: [Risk]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskSentinelRequest'
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Risk analysis
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskSentinelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /v1/agent/receipts/share:
    post:
      operationId: createReceiptShare
      summary: Mint a public proof-of-outcome share link for a receipt
      description: |
        Creates an unguessable, revocable bearer token (fdrsh_…) over a
        TERMINAL intent receipt (CONFIRMED, FAILED, or REJECTED — in-flight
        receipts are rejected with 409). Only the SHA-256 of the token is
        stored; the token is returned once and cannot be recovered. The served
        projection is sanitized (credential-shaped fields stripped recursively
        and every stripped path disclosed), digest-bound (SHA-256 full + public
        digests), outcome classified, and Ed25519-signed. Requires session
        ownership of the receipt's parent intent.
      tags: [Proof]
      security:
        - bearerAuth: []
        - {}
      servers:
        - url: https://www.farmdash.one
          description: Production (public proof paths live at the site root)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt_id, sessionId, agentAddress, sessionToken]
              properties:
                receipt_id:
                  type: string
                  description: Receipt id starting with fdrcpt_
                sessionId:
                  type: string
                agentAddress:
                  type: string
                sessionToken:
                  type: string
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '201':
          description: Share created — token shown once, never recoverable
          content:
            application/json:
              schema:
                type: object
                required: [ok, token, url, receipt_id, warning]
                properties:
                  ok:
                    type: boolean
                    const: true
                  token:
                    type: string
                    description: fdrsh_-prefixed bearer token; store it now
                  url:
                    type: string
                    format: uri
                  receipt_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  warning:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: Receipt not found
        '409':
          description: Receipt not terminal (still in flight)
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    delete:
      operationId: revokeReceiptShare
      summary: Revoke a receipt share link
      description: |
        Revokes the share (public URL returns 410 afterwards). Only the
        creating agent (or internal service key) can revoke. Pass the token
        as ?token= or in the body, AND the session credentials used at
        creation (sessionId, agentAddress, and sessionToken via body or the
        X-FarmDash-Session-Token header). Revocation propagates immediately —
        share responses are served with Cache-Control: no-store.
      tags: [Proof]
      security:
        - bearerAuth: []
        - {}
      servers:
        - url: https://www.farmdash.one
          description: Production (public proof paths live at the site root)
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                sessionId:
                  type: string
                agentAddress:
                  type: string
                sessionToken:
                  type: string
      responses:
        '200':
          description: Share revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  revoked:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Unknown share, already revoked, or not the creator
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /r/{token}:
    get:
      operationId: resolveReceiptShare
      summary: Resolve a public receipt share (agent JSON or human page)
      description: |
        Public, keyless, TOLL-FREE proof-of-outcome endpoint. Returns the sanitized
        receipt, outcome classification with retry guidance, dual integrity
        digests, and the Ed25519 signature block containing the detached
        signature bytes and the exact signed envelope — verify independently
        against /.well-known/farmdash-receipt-key.json. Responds JSON by
        default and a retro no-JS HTML card when Accept includes text/html.
        Revoked shares return 410. Responses are no-store (revocation is
        immediate); a `valid:true` signature flag is a server self-check —
        third parties MUST verify the signature themselves.
        Verification reads are never payment-walled but share the caller's
        daily booth budget and 429 past it, so spam burns its own bucket.
        Share tokens are unguessable 256-bit bearer secrets with no listing
        endpoint, so enumeration is infeasible. Minting (POST
        /api/v1/agent/receipts/share) remains session- and toll-gated.
      tags: [Proof]
      security:
        - {}
      servers:
        - url: https://www.farmdash.one
          description: Production (public proof paths live at the site root)
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shared receipt payload (JSON) or card (HTML)
        '404':
          description: Unknown share token
        '405':
          description: Method not allowed (resolve is GET-only)
        '410':
          description: Share revoked by its creator
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /.well-known/farmdash-receipt-key.json:
    get:
      operationId: getReceiptProofKey
      summary: Public Ed25519 key for verifying shared-receipt signatures
      description: |
        Publishes the JWK verification key ring (current key plus any
        retained/retired keys by kid) with the exact third-party verification
        recipe (canonicalize the share JSON receipt object, compare
        public_digest, verify the envelope signature with the key whose kid
        matches integrity.signature.kid). Long-cacheable.
        Key type is validated at load time (Ed25519 only).
      tags: [Proof]
      security:
        - {}
      servers:
        - url: https://www.farmdash.one
          description: Production (public proof paths live at the site root)
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Proof key document

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Pioneer or Syndicate API key

  # ── Shared Parameters ──────────────────────────────────────────

  parameters:
    FromChainId:
      name: fromChainId
      in: query
      required: true
      schema:
        type: integer
        enum: [1, 10, 137, 8453, 42161, 59144]
      description: 'Source chain: 1=Ethereum, 10=Optimism, 137=Polygon, 8453=Base, 42161=Arbitrum, 59144=Linea'
    ToChainId:
      name: toChainId
      in: query
      required: true
      schema:
        type: integer
        enum: [1, 10, 137, 8453, 42161, 59144]
      description: Destination chain ID
    FromToken:
      name: fromToken
      in: query
      required: true
      schema:
        type: string
        pattern: '^0x[a-fA-F0-9]{40}$'
      description: Source token contract address
    ToToken:
      name: toToken
      in: query
      required: true
      schema:
        type: string
        pattern: '^0x[a-fA-F0-9]{40}$'
      description: Destination token contract address
    FromAmount:
      name: fromAmount
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d+$'
      description: Amount in wei (no leading zeros)

  # ── Shared Headers ─────────────────────────────────────────────

    X-ClawHub-Skill:
      name: X-ClawHub-Skill
      in: header
      required: false
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-]{1,128}$'
        example: farmdash-signal-architect
      description: 'ClawHub skill attribution. An installed FarmDash skill sends its canonical skill slug (e.g. farmdash-signal-architect) on every FarmDash API request so anonymous Scout usage can be attributed to the skill that drove it. Optional and analytics-only: absence never blocks a request, and malformed values are ignored. This is a skill identity, never a wallet address, API key, or user ID.'

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed in the current window
      schema:
        type: string
    X-RateLimit-Remaining:
      description: Remaining requests in the current window
      schema:
        type: string
    X-RateLimit-Reset:
      description: UTC epoch seconds when the rate limit window resets
      schema:
        type: string
    X-Request-ID:
      description: Unique request trace ID for debugging and support
      schema:
        type: string
        format: uuid
    X-Scout-Bonus-Remaining:
      description: Remaining overflow-only free reads for public reputation/leaderboard after the shared Scout budget is spent. Present only on bonus-served 200s from those two endpoints.
      schema:
        type: string

  # ── Shared Responses ───────────────────────────────────────────

  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: Free-tier limit exceeded — x402 payment required
      headers:
        X-Payment-Required:
          schema:
            type: string
        X-Payment-Address:
          schema:
            type: string
          description: Treasury wallet (USDC on Base)
        X-Payment-Token:
          schema:
            type: string
          description: USDC contract on Base
        X-Payment-Amount:
          schema:
            type: string
          description: Amount in token decimals (990000 = 0.99 USDC)
        X-Payment-Chain-Id:
          schema:
            type: string
          description: '8453 (Base)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequiredError'
    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoRoute:
      description: Syntactically valid request but no executable route (no liquidity, unsupported pair, allowance/balance preconditions). Code quote_no_route, retryable false — retrying identical params will not help.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderTimeout:
      description: Live quote provider timed out (bounded 15s upstream call). Code quote_provider_timeout, retryable true — back off and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ── Schemas ────────────────────────────────────────────────────

  schemas:

    # ── Common ──

    ErrorResponse:
      type: object
      required: [error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true

    PaymentRequiredError:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: payment_required
        code:
          type: string
          description: "`free_quota_exhausted` when the shared Scout allowance is spent; otherwise `payment_required`."
          example: free_quota_exhausted
        message:
          type: string
        instruction:
          type: string
          enum: [STOP_RETRYING]
          description: Present when an exhausted free caller must not repeat the same unpaid request.
        retry_same_request:
          type: boolean
          example: false
        next_action:
          type: string
          example: Wait for your quota reset, upgrade your plan, or use x402 paid access.
        quota:
          type: object
          properties:
            tier:
              type: string
              example: scout
            remaining:
              type: integer
              example: 0
            reset_at:
              type: string
              format: date-time
        abuse_notice:
          type: string
          example: Repeated automated requests while quota is exhausted may result in temporary or permanent API blocking.
        retryable:
          type: boolean
        upgrade_url:
          type: string
          format: uri
        direct_upgrade_url:
          type: string
          format: uri
        rate_limit:
          type: object
          additionalProperties: true
        developer_sandbox:
          type: object
          additionalProperties: true
        payment_required:
          type: object
          properties:
            amount:
              type: string
              example: '0.01 USDC'
            chain:
              type: string
              example: Base
            destination:
              type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            token:
              type: string
            chainId:
              type: integer
              example: 8453

    DustStormWarning:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          const: dust_storm
        message:
          type: string

    SupportedProtocol:
      type: string
      enum: [lifi, relay]
      description: Swap quote provider. Automatic routing compares all healthy compatible providers (LI.FI, Relay; 0x paused until reinstated); force one with ?protocol= (deterministic, never silent fallback).

    SwapSafetyMode:
      type: string
      enum: [strict, balanced]

    RiskSeverity:
      type: string
      enum: [low, medium, high, critical]

    QuoteDecaySeverity:
      type: string
      enum: [none, low, medium, high]

    Tier:
      type: string
      enum: [scout, pioneer, syndicate]

    SwapTxData:
      type: object
      required: [to, data, value, chainId]
      properties:
        to:
          type: string
          description: Protocol contract address (NOT FarmDash)
        data:
          type: string
          description: Encoded calldata
        value:
          type: string
          description: Native token value in wei
        chainId:
          type: integer

    # ── Swap Schemas ──

    SwapSimulationRequest:
      type: object
      required: [intent_id, wallet_address]
      properties:
        intent_id:
          type: string
          description: Wallet-bound quote intent returned by /agents/quote
          example: fd_intent_7f3a
        wallet_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Signing wallet for the simulated execution

    SwapSimulationResponse:
      type: object
      required: [ok, simulation_id, intent_id, success, gas_used, gas_cost_usd, output_amount, mev_risk, valid_until, wallet_address, selected_protocol, required_for_execution]
      properties:
        ok:
          type: boolean
          example: true
        simulation_id:
          type: string
          example: sim_9b2e
        intent_id:
          type: string
        success:
          type: boolean
        gas_used:
          type: number
        gas_cost_usd:
          type: number
        output_amount:
          type: string
        price_impact_pct:
          type: number
          nullable: true
        mev_risk:
          type: string
          enum: [low, medium, high]
        revert_reason:
          type: string
          nullable: true
        valid_until:
          type: string
          format: date-time
        wallet_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        selected_protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        tx_fingerprint:
          type: string
        request_fingerprint:
          type: string
        provider:
          type: string
        cached:
          type: boolean
        required_for_execution:
          type: boolean
          const: true

    SwapRequest:
      type: object
      required: [fromChainId, toChainId, fromToken, toToken, fromAmount, agentAddress, toAddress, simulationId, nonce, signature]
      properties:
        fromChainId:
          type: integer
          enum: [1, 10, 137, 8453, 42161, 59144]
        toChainId:
          type: integer
          enum: [1, 10, 137, 8453, 42161, 59144]
        fromToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        toToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        fromAmount:
          type: string
          pattern: '^\d+$'
          description: Amount in wei
        agentAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Agent wallet address (signer)
        toAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Destination wallet for swapped tokens
        slippage:
          type: number
          minimum: 0.01
          maximum: 5
          default: 0.5
          description: Slippage tolerance in percent (capped at 5%)
        protocol:
          type: string
          enum: [lifi, relay]
        volumeHintUSD:
          type: number
          description: Advisory telemetry only — never determines the fee tier. Fee BPS uses server-oracle-derived input volume exclusively (50 bps under $10k, 45 bps at $10k+, 40 bps at $100k+, 30 bps at $1M+ combined routing target); unknown volume pays the default tier.
        expectedUpsideUsd:
          type: number
          description: Optional upside estimate in USD for positive-net-edge checks
        riskBufferUsd:
          type: number
          description: Optional extra execution-risk buffer in USD
        healthFactor:
          type: number
          description: Optional lending health factor supplied by the caller
        liquidationBufferPct:
          type: number
          description: Optional liquidation-buffer percentage supplied by the caller
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Optional wallet address used for on-chain approval checks
        safetyMode:
          $ref: '#/components/schemas/SwapSafetyMode'
          description: "`strict` halts on severe quote decay, `balanced` downgrades that condition to a warning"
        simulationId:
          type: string
          description: Fresh successful simulation_id from POST /v1/simulate
        intentId:
          type: string
          description: Optional qi_* quote-cache/idempotency identity; must match the simulation when supplied. Do not pass this value to /v1/simulate.
        nonce:
          type: string
          description: Current timestamp in milliseconds (60s window)
        signature:
          type: string
          pattern: '^0x[a-fA-F0-9]{130}$'
          description: EIP-191 personal_sign of the v1 versioned payload

    AllowanceStatus:
      type: object
      properties:
        spender:
          type: string
          nullable: true
        allowance:
          type: string
          nullable: true
        requiredAmount:
          type: string
        approvalNeeded:
          type: boolean
        overApproved:
          type: boolean
        source:
          type: string
          enum: [onchain, quote_fallback, unavailable]

    RiskFlag:
      type: object
      required: [code, category, severity, title, message]
      properties:
        code:
          type: string
        category:
          type: string
          enum: [approval, bridge, contract, token, health, execution]
        severity:
          $ref: '#/components/schemas/RiskSeverity'
        title:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true

    PegCheck:
      type: object
      properties:
        tokenAddress:
          type: string
        symbol:
          type: string
        reference:
          type: string
          enum: [USD, ETH]
        priceUsd:
          type: number
          nullable: true
        referencePriceUsd:
          type: number
          nullable: true
        deviationPct:
          type: number
          nullable: true
        alert:
          type: boolean

    HealthCheck:
      type: object
      properties:
        healthFactor:
          type: number
          nullable: true
        liquidationBufferPct:
          type: number
          nullable: true
        alertLevel:
          type: string
          enum: [none, warning, critical]
        shouldHalt:
          type: boolean

    NetEdgeAnalysis:
      type: object
      properties:
        expectedUpsideUsd:
          type: number
          nullable: true
        protocolFeeUsd:
          type: number
        gasUsd:
          type: number
        bridgeFeeUsd:
          type: number
        riskBufferUsd:
          type: number
        totalCostUsd:
          type: number
        netEdgeUsd:
          type: number
          nullable: true
        positive:
          type: boolean
          nullable: true
        enforced:
          type: boolean

    QuoteDecayMetrics:
      type: object
      properties:
        previousObservedAt:
          type: integer
          nullable: true
        quoteAgeMs:
          type: integer
          nullable: true
        outputDecayBps:
          type: number
        gasIncreaseBps:
          type: number
        severity:
          $ref: '#/components/schemas/QuoteDecaySeverity'

    RouteCandidate:
      type: object
      properties:
        protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        estimatedOutput:
          type: string
        feeAmountUsd:
          type: number
        gasEstimateUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        routeRiskScore:
          type: number
        selected:
          type: boolean

    ExecutionAlphaReport:
      type: object
      properties:
        selectedProtocol:
          $ref: '#/components/schemas/SupportedProtocol'
        routeReason:
          type: string
        mevProtection:
          type: object
          properties:
            safetyMode:
              $ref: '#/components/schemas/SwapSafetyMode'
            actualSlippageBps:
              type: integer
            maxRecommendedSlippageBps:
              type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RouteCandidate'
        quoteDecay:
          $ref: '#/components/schemas/QuoteDecayMetrics'
        netEdge:
          $ref: '#/components/schemas/NetEdgeAnalysis'

    SwapRiskReport:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/RiskFlag'
        approval:
          allOf:
            - $ref: '#/components/schemas/AllowanceStatus'
          nullable: true
        pegChecks:
          type: array
          items:
            $ref: '#/components/schemas/PegCheck'
        health:
          allOf:
            - $ref: '#/components/schemas/HealthCheck'
          nullable: true
        shouldHalt:
          type: boolean
        haltReasons:
          type: array
          items:
            type: string

    QuoteResponse:
      type: object
      required: [protocol, estimatedOutput, feeBps, feeAmountUSD, gasEstimate, txData, expiresAt]
      properties:
        protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        estimatedOutput:
          type: string
          description: Expected output in wei
        feeBps:
          type: integer
          description: Fee in basis points (45 = 0.45% default; configured volume discounts may apply)
        mode:
          type: string
          const: live
        unsigned:
          type: boolean
          const: true
        broadcast_by_farmdash:
          type: boolean
          const: false
        feeAmountUSD:
          type: string
        gasEstimate:
          type: string
        txData:
          $ref: '#/components/schemas/SwapTxData'
        expiresAt:
          type: integer
          description: Unix timestamp — quotes valid 30s
        simulation_required:
          type: boolean
          description: True when execute_swap requires a simulation for this route
        simulation_available:
          type: boolean
          description: True when the quote was wallet-bound and returned an intent_id
        intent_id:
          type: string
          nullable: true
          description: Pass this to POST /v1/simulate before execution
        intent_expires_at:
          type: string
          nullable: true
          format: date-time
        simulate_url:
          type: string
          example: /api/v1/simulate
        allowanceTarget:
          type: string
          nullable: true
        gasEstimateUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'
        note:
          type: string

    MarketEstimateResponse:
      type: object
      required:
        - quoteKind
        - executionReady
        - liquidityConfirmed
        - priceUnknown
        - feeTierBps
        - volumeUnknown
        - compatibleProviders
        - routeSupported
        - sources
        - confidence
        - observedAt
        - cached
        - stale
        - unsigned
        - broadcast_by_farmdash
        - execution_boundary
        - note
      properties:
        quoteKind:
          type: string
          enum: [market_estimate]
        executionReady:
          type: boolean
          enum: [false]
        liquidityConfirmed:
          type: boolean
          enum: [false]
        providerAttribution:
          type: string
          nullable: true
        referencePriceUsd:
          type: number
          nullable: true
        estimatedInputUsd:
          type: number
          nullable: true
        estimatedOutputUsd:
          type: number
          nullable: true
        priceUnknown:
          type: boolean
        feeTierBps:
          type: integer
        volumeUnknown:
          type: boolean
        compatibleProviders:
          type: array
          items:
            type: string
        routeSupported:
          type: boolean
        liquidityUsd:
          type: number
          nullable: true
        volume24hUsd:
          type: number
          nullable: true
        sources:
          type: array
          items:
            type: string
        confidence:
          type: string
          enum: [high, medium, low]
        observedAt:
          type: string
        cached:
          type: boolean
        stale:
          type: boolean
        attempts:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        unsigned:
          type: boolean
          enum: [true]
        broadcast_by_farmdash:
          type: boolean
          enum: [false]
        simulation_required:
          type: boolean
        simulate_url:
          type: string
        execution_boundary:
          type: object
          properties:
            state:
              type: string
            simulation_required:
              type: boolean
            local_signature_required:
              type: boolean
            farmdash_broadcasts_transaction:
              type: boolean
        note:
          type: string

    FirmQuoteResponse:
      type: object
      required:
        - intentId
        - quoteKind
        - reused
        - selectedProvider
        - firmQuote
        - expiresAt
        - executionReady
        - simulationRequirements
        - attempts
        - alternateUsed
        - unsigned
        - broadcast_by_farmdash
        - executionAlpha
        - riskReport
        - execution_boundary
        - note
      properties:
        intentId:
          type: string
        quoteKind:
          type: string
          enum: [firm_quote]
        reused:
          type: boolean
        marketBenchmark:
          type: object
          nullable: true
        selectedProvider:
          $ref: '#/components/schemas/SupportedProtocol'
        firmQuote:
          type: object
        expiresAt:
          type: string
        executionReady:
          type: boolean
        approval:
          type: object
          nullable: true
        simulationRequirements:
          type: object
          properties:
            required:
              type: boolean
            simulate_url:
              type: string
            intent_id:
              type: string
              description: fd_intent_* execution-simulation identity. Pass this value to /v1/simulate.
            valid_for_execution:
              type: boolean
            plan:
              type: object
              nullable: true
            signatures:
              type: array
              nullable: true
        attempts:
          type: array
          items:
            type: object
        alternateUsed:
          type: boolean
        unsigned:
          type: boolean
          enum: [true]
        broadcast_by_farmdash:
          type: boolean
          enum: [false]
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'
        execution_boundary:
          type: object
          properties:
            state:
              type: string
            simulation_required:
              type: boolean
            local_signature_required:
              type: boolean
            farmdash_broadcasts_transaction:
              type: boolean
        note:
          type: string

    SwapResult:
      type: object
      required: [protocol, estimatedOutput, feeBps, feeAmountUSD, gasEstimate, txData, expiresAt]
      properties:
        protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        estimatedOutput:
          type: string
        feeBps:
          type: integer
        feeAmountUSD:
          type: string
        feeEventId:
          type: string
          format: uuid
          description: Use with /agents/confirm to confirm settlement
        gasEstimate:
          type: string
        txData:
          $ref: '#/components/schemas/SwapTxData'
        expiresAt:
          type: integer
        allowanceTarget:
          type: string
          nullable: true
        gasEstimateUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        simulation:
          type: object
          additionalProperties: true
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'
        confirmUrl:
          type: string
          example: /api/agents/confirm

    SwapHaltResponse:
      type: object
      properties:
        error:
          type: string
          example: swap_halted
        code:
          type: string
          example: swap_halted
        selectedProtocol:
          $ref: '#/components/schemas/SupportedProtocol'
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'

    RiskSentinelRequest:
      type: object
      description: Provide either manual health/net-edge inputs or a full swap-shaped request for route-aware analysis.
      properties:
        fromChainId:
          type: integer
          enum: [1, 10, 137, 8453, 42161, 59144]
        toChainId:
          type: integer
          enum: [1, 10, 137, 8453, 42161, 59144]
        fromToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        toToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        fromAmount:
          type: string
          pattern: '^\d+$'
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        toAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        protocol:
          type: string
          enum: [lifi, relay]
        slippage:
          type: number
        expectedUpsideUsd:
          type: number
        riskBufferUsd:
          type: number
        healthFactor:
          type: number
        liquidationBufferPct:
          type: number
        protocolFeeUsd:
          type: number
        gasUsd:
          type: number
        bridgeFeeUsd:
          type: number
        enforcePositive:
          type: boolean
        safetyMode:
          $ref: '#/components/schemas/SwapSafetyMode'

    RiskSentinelResponse:
      type: object
      properties:
        ok:
          type: boolean
        mode:
          type: string
          enum: [manual, quoted]
        selectedProtocol:
          allOf:
            - $ref: '#/components/schemas/SupportedProtocol'
          nullable: true
        executionAlpha:
          allOf:
            - $ref: '#/components/schemas/ExecutionAlphaReport'
          nullable: true
        riskReport:
          allOf:
            - $ref: '#/components/schemas/SwapRiskReport'
          nullable: true
        quotePreview:
          allOf:
            - $ref: '#/components/schemas/SwapResult'
          nullable: true
        health:
          allOf:
            - $ref: '#/components/schemas/HealthCheck'
          nullable: true
        netEdge:
          allOf:
            - $ref: '#/components/schemas/NetEdgeAnalysis'
          nullable: true
        flags:
          type: array
          items:
            $ref: '#/components/schemas/RiskFlag'
        shouldHalt:
          type: boolean

    ConfirmRequest:
      type: object
      required: [sessionId, agentAddress, feeEventId, txHash]
      properties:
        sessionId:
          type: string
          description: Owning FarmDash session id (the session that owns the fee event).
        agentAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Session owner / customer wallet address.
        sessionToken:
          type: string
          description: >-
            Optional in this raw-HTTP schema: the session credential may be sent in
            the request body or via the X-FarmDash-Session-Token header. It
            authenticates the FarmDash session only; it is not wallet signing or
            transaction authority, and FarmDash never broadcasts the swap on the
            caller's behalf.
        feeEventId:
          type: string
          format: uuid
          description: FarmDash fee-event id associated with the prepared swap.
        txHash:
          type: string
          pattern: '^0x[a-fA-F0-9]{64}$'
          description: >-
            On-chain transaction hash, which exists only after the
            customer-controlled wallet broadcast. A transaction hash alone is not
            confirmation: FarmDash verifies the canonical receipt/finality and the
            expected fee transfer before durable settlement is recorded.

    ConfirmResponse:
      type: object
      properties:
        ok:
          type: boolean
        feeEventId:
          type: string
          format: uuid
        settlementStatus:
          type: string
          enum: [confirmed, pending, expired]
        idempotent:
          type: boolean
          description: True if this was a duplicate confirmation (safe to retry)

    # ── History Schemas ──

    FeeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        from_token:
          type: string
        to_token:
          type: string
        volume_usd:
          type: number
        fee_bps:
          type: integer
        fee_usd:
          type: number
        agent_address:
          type: string
        tx_hash:
          type: string
          nullable: true
        settlement_status:
          type: string
          enum: [pending, confirmed, expired, legacy]
        chain_id:
          type: integer

    HistoryResponse:
      type: object
      required: [events, total, limit, offset]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/FeeEvent'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    RevenueMetrics:
      type: object
      required: [totalFeeUSD, totalVolumeUSD, totalSwaps, activeAgents]
      properties:
        totalFeeUSD:
          type: number
        totalVolumeUSD:
          type: number
        totalSwaps:
          type: integer
        activeAgents:
          type: integer

    LeaderboardResponse:
      type: object
      required: [ok, source, entries]
      properties:
        ok:
          type: boolean
        source:
          type: string
          description: Always 'fee_events_aggregated' — aggregates only, never raw events
        windowDays:
          type: integer
          nullable: true
        entries:
          type: array
          maxItems: 50
          items:
            type: object
            required: [address, totalVolumeUSD, totalFeeUSD, swapCount]
            properties:
              address:
                type: string
              totalVolumeUSD:
                type: number
              totalFeeUSD:
                type: number
              swapCount:
                type: integer

    ReputationResponse:
      type: object
      required: [ok, reputation]
      properties:
        ok:
          type: boolean
        reputation:
          type: object
          required: [address, trailCred, badge]
          properties:
            address:
              type: string
            trailCred:
              type: number
            badge:
              type: string
            onchainScore:
              type: number
            vouchScore:
              type: number
            vouchCount:
              type: integer
            vouchers:
              type: array
              maxItems: 50
              items:
                type: object
            activity:
              type: object
            onchainData:
              nullable: true
            computedAt:
              type: string
              nullable: true
        scout_bonus:
          type: object
          description: Present only on overflow-bonus 200s after the shared Scout budget is spent
          properties:
            used:
              type: integer
            limit:
              type: integer
            remaining:
              type: integer

    # ── Intelligence Schemas ──

    ProtocolItem:
      type: object
      properties:
        protocol_name:
          type: string
        discovery_heuristic_score:
          oneOf:
            - type: number
            - type: string
              description: Encrypted for scout tier
          description: Catalog editorial heuristic (methodology catalog-editorial-v1). NOT live Trail Heat — canonical quantitative scores live at /v1/trail-heat.
        discovery_methodology:
          type: string
        sybil_risk:
          type: string
        tvl:
          type: string
        category:
          type: string
          enum: [Perps, Lending, Dex, L2, Bridge, Restaking, HyperEVM, Infra, Wallet, Testnet]
        status:
          type: string
          enum: [Confirmed Airdrop, Points Program, Speculative]
        chains:
          type: array
          items:
            type: string
        recommended_agent_deploy_link:
          type: string
          format: uri

    ProtocolsResponse:
      type: object
      required: [tier, count, data]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolItem'
        status:
          type: string
        message:
          type: string
        direct_upgrade_url:
          type: string
          format: uri
        total_protocols_available:
          type: integer

    ChainBreakdownItem:
      type: object
      properties:
        chain:
          type: string
        protocol_count:
          oneOf: [{ type: integer }, { type: string }]
        pct_of_total:
          oneOf: [{ type: number }, { type: string }]
        confirmed_airdrops:
          oneOf: [{ type: integer }, { type: string }]
        points_programs:
          oneOf: [{ type: integer }, { type: string }]
        categories:
          type: array
          items:
            type: string

    ChainBreakdownSummary:
      type: object
      properties:
        total_chains:
          type: integer
        total_protocols:
          oneOf: [{ type: integer }, { type: string }]
        dominant_chain:
          type: string
          nullable: true
        dominant_chain_pct:
          oneOf: [{ type: number }, { type: string }]

    ChainBreakdownResponse:
      type: object
      required: [tier, data]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        status:
          type: string
        message:
          type: string
        direct_upgrade_url:
          type: string
          format: uri
        data:
          type: object
          properties:
            chains:
              type: array
              items:
                $ref: '#/components/schemas/ChainBreakdownItem'
            summary:
              $ref: '#/components/schemas/ChainBreakdownSummary'

    # ── Futures Schemas ──

    FundingAnalysis:
      type: object
      properties:
        coin:
          type: string
        fundingRate:
          type: number
        annualizedRate:
          type: number
        predictedRate:
          type: number
        crossVenueDelta:
          type: number
        premium:
          type: number
        openInterest:
          type: number
        isArbOpportunity:
          type: boolean
        arbDirection:
          type: string
          nullable: true
          enum: [long_spot_short_perp, short_spot_long_perp, null]

    TechnicalIndicators:
      type: object
      properties:
        ema8: { type: number }
        ema34: { type: number }
        emaCross: { type: string, enum: [bullish, bearish, neutral] }
        rsi: { type: number }
        macd: { type: number }
        macdSignal: { type: number }
        macdHistogram: { type: number }
        macdCross: { type: string, enum: [bullish_cross, bearish_cross, neutral] }
        adx: { type: number }
        atr: { type: number }
        bbUpper: { type: number }
        bbMiddle: { type: number }
        bbLower: { type: number }
        bbWidth: { type: number }
        volumeRatio: { type: number }
        zScore: { type: number }

    ScanFundingResponse:
      type: object
      properties:
        ok:
          type: boolean
        tier:
          $ref: '#/components/schemas/Tier'
        arbOpportunities:
          type: array
          items:
            $ref: '#/components/schemas/FundingAnalysis'
        highFunding:
          type: array
          items:
            $ref: '#/components/schemas/FundingAnalysis'
        totalScanned:
          type: integer
        upgradeMessage:
          type: string
        timestamp:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    MarketConditionsResponse:
      type: object
      properties:
        ok:
          type: boolean
        coin:
          type: string
        indicators:
          $ref: '#/components/schemas/TechnicalIndicators'
        strategyHint:
          type: string
          enum: [momentum_long, momentum_short, mean_reversion, no_trade]
        timestamp:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    FuturesPosition:
      type: object
      properties:
        coin: { type: string }
        size: { type: number }
        side: { type: string, enum: [long, short] }
        entryPrice: { type: number }
        markPrice: { type: number }
        unrealizedPnl: { type: number }
        returnOnEquity: { type: number }
        leverage: { type: number }
        leverageType: { type: string }
        liquidationPrice: { type: number, nullable: true }
        marginUsed: { type: number }

    AccountSummary:
      type: object
      properties:
        equity: { type: string }
        totalNotionalPosition: { type: string }
        marginUsed: { type: string }
        availableMargin: { type: string }
        aggregateLeverage: { type: string }

    RiskState:
      type: object
      properties:
        dailyPnl: { type: string }
        dailyPnlPct: { type: string }
        weeklyPnl: { type: string }
        realizedDailyPnl: { type: string }
        realizedWeeklyPnl: { type: string }
        unrealizedPnl: { type: string }
        pnlSource: { type: string, enum: [hyperliquid_venue_loss_pressure] }
        pnlAsOf: { type: integer, format: int64 }
        pnlMethodology: { type: string }
        drawdown: { type: string }
        peakEquity: { type: string }
        isTradingHalted: { type: boolean }
        haltReason: { type: string, nullable: true }
        isReducedSize: { type: boolean }
        openPositionCount: { type: integer }

    Guardrails:
      type: object
      properties:
        maxLeverage: { type: integer, example: 5 }
        maxRiskPerTrade: { type: string, example: '2%' }
        maxPositions: { type: integer }
        dailyLossLimit: { type: string, example: '-3%' }
        weeklyLossLimit: { type: string, example: '-7%' }
        maxDrawdown: { type: string, example: '-15%' }

    AccountStateResponse:
      type: object
      properties:
        ok: { type: boolean }
        account:
          $ref: '#/components/schemas/AccountSummary'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/FuturesPosition'
        risk:
          $ref: '#/components/schemas/RiskState'
        guardrails:
          $ref: '#/components/schemas/Guardrails'
        timestamp: { type: integer }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    FuturesMarketRegime:
      type: string
      enum: [trending, ranging, high_volatility, low_liquidity]

    FuturesTradeDirection:
      type: string
      enum: [long, short, neutral]

    FuturesStrategyObject:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [futures] }
        market: { type: string }
        direction:
          $ref: '#/components/schemas/FuturesTradeDirection'
        regime:
          $ref: '#/components/schemas/FuturesMarketRegime'
        triggerConditions:
          type: array
          items: { type: string }
        entryLogic: { type: string }
        exitLogic: { type: string }
        riskModel:
          type: object
          properties:
            baseRiskPercent: { type: number }
            appliedRiskPercent: { type: number }
            riskMultiplier: { type: number }
            leverageCap: { type: number }
            stopModel: { type: string }
        leverageModel:
          type: object
          properties:
            mode: { type: string, enum: [adaptive] }
            suggested: { type: number }
            cap: { type: number }
            drivers:
              type: array
              items: { type: string }
        fallbackLogic:
          type: array
          items: { type: string }
        telemetryTracking:
          type: array
          items: { type: string }

    FuturesAdaptiveRisk:
      type: object
      properties:
        baseRiskPercent: { type: number }
        appliedRiskPercent: { type: number }
        confidenceMultiplier: { type: number }
        volatilityMultiplier: { type: number }
        drawdownMultiplier: { type: number }
        portfolioMultiplier: { type: number }
        finalRiskMultiplier: { type: number }

    FuturesTradeSimulation:
      type: object
      properties:
        methodology: { type: string, enum: [heuristic_preflight] }
        holdingWindowHours: { type: number }
        entryValueUsd: { type: number }
        marginRequiredUsd: { type: number }
        marginImpactPct: { type: number }
        liquidationPriceEstimate: { type: number, nullable: true }
        stopScenarioPnlUsd: { type: number }
        targetScenarioPnlUsd: { type: number }
        oneAtrMovePnlUsd: { type: number }
        estimatedFundingPnl24hUsd: { type: number }
        estimatedFundingPnl72hUsd: { type: number }

    FuturesPortfolioContext:
      type: object
      properties:
        openPositionCount: { type: integer }
        sameAssetExposureUsd: { type: number }
        sameAssetExposurePct: { type: number }
        directionalExposurePct: { type: number }
        netDirectionalBias: { type: string, enum: [net_long, net_short, balanced] }
        concentrationWarning: { type: string, nullable: true }

    StrategyRecommendation:
      type: object
      properties:
        recommendedStrategy:
          type: string
          enum: [funding_arb, momentum_long, momentum_short, trend_pullback_long, trend_pullback_short, mean_reversion, no_trade]
        confidence: { type: number }
        asset: { type: string }
        marketRegime:
          $ref: '#/components/schemas/FuturesMarketRegime'
        entry: { type: number }
        stopLoss: { type: number }
        takeProfit: { type: number }
        positionSize: { type: number }
        leverage: { type: number, maximum: 5 }
        riskPercent: { type: number, maximum: 0.02 }
        reasoning:
          type: array
          items: { type: string }
        noTradeReason: { type: string, nullable: true }
        strategyObject:
          $ref: '#/components/schemas/FuturesStrategyObject'
        adaptiveRisk:
          $ref: '#/components/schemas/FuturesAdaptiveRisk'
        simulation:
          $ref: '#/components/schemas/FuturesTradeSimulation'
        portfolioContext:
          $ref: '#/components/schemas/FuturesPortfolioContext'
        trailHeatCrossRef:
          type: object
          properties:
            protocolId: { type: string }
            score: { type: number }
            farmingOpportunity: { type: boolean }
            referralLink: { type: string, format: uri }
        fundingAnalysis:
          $ref: '#/components/schemas/FundingAnalysis'
        indicators:
          $ref: '#/components/schemas/TechnicalIndicators'

    AnalyzeStrategyResponse:
      type: object
      properties:
        ok: { type: boolean }
        recommendation:
          $ref: '#/components/schemas/StrategyRecommendation'
        account:
          type: object
          properties:
            equity: { type: string }
            availableMargin: { type: string }
            openPositions: { type: integer }
        guardrails:
          $ref: '#/components/schemas/Guardrails'
        timestamp: { type: integer }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    PositionSizingRequest:
      type: object
      required: [equity, entryPrice, stopPrice]
      properties:
        equity: { type: number, description: Account equity in USD }
        entryPrice: { type: number }
        stopPrice: { type: number }
        riskPercent: { type: number, maximum: 0.02, description: 'Capped at 2%' }
        targetPrice: { type: number, description: For R:R calculation }
        riskMultiplier:
          type: number
          minimum: 0.1
          maximum: 1.0
          description: Optional flexibility modifier for risk tolerance. 1.0 keeps the full risk budget; lower values are more conservative.

    PositionSizing:
      type: object
      properties:
        positionSize: { type: number }
        positionValueUsd: { type: number }
        leverage: { type: number }
        marginRequired: { type: number }
        riskAmount: { type: number }
        riskPercent: { type: number }
        stopDistance: { type: number }
        rewardRiskRatio: { type: number }

    PositionSizingResponse:
      type: object
      properties:
        ok: { type: boolean }
        sizing:
          $ref: '#/components/schemas/PositionSizing'
        guardrails:
          type: object
          properties:
            maxLeverage: { type: integer }
            maxRiskPerTrade: { type: string }
            maxPositionValue: { type: string }
            note: { type: string }
        timestamp: { type: integer }

    EIP712Signature:
      type: object
      required: [r, s, v]
      properties:
        r: { type: string }
        s: { type: string }
        v: { type: integer }

    ExecuteOrderRequest:
      type: object
      required: [agentAddress, coin, isBuy, size, price, orderType, nonce, expiresAt, intentHash, signature]
      properties:
        agentAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        coin: { type: string }
        isBuy: { type: boolean }
        size: { type: string }
        price: { type: string }
        orderType:
          type: string
          enum: [limit_gtc, limit_ioc, limit_alo, market_ioc, stop_loss, take_profit]
          description: '`market_ioc` is a signed, price-protected IOC limit order with a live 100 bps adverse-price cap, never an unbounded market order.'
        reduceOnly: { type: boolean, default: false }
        leverage:
          oneOf:
            - type: number
            - type: string
        signedAction:
          type: object
          description: 'If supplied, must contain the signed FarmDash builder term `{ b: treasury, f: 1 }`; f is tenths of a basis point.'
        nonce: { type: integer }
        expiresAt: { type: integer }
        intentHash: { type: string }
        signature:
          $ref: '#/components/schemas/EIP712Signature'

    ExecuteOrderResponse:
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string, enum: [fully_filled, partially_filled, zero_fill, resting_unfilled, rejected, unknown] }
        result:
          type: object
          properties:
            status: { type: string }
            response: { type: object }
        order:
          type: object
          properties:
            coin: { type: string }
            side: { type: string, enum: [buy, sell] }
            size: { type: string }
            price: { type: string }
            type: { type: string }
            reduceOnly: { type: boolean }
            leverage: { type: number }
            leverageStatus: { type: string, enum: [risk_check_metadata_only] }
            builderFee:
              type: object
              properties:
                recipient: { type: string }
                venueUnitsTenthsBps: { type: number, example: 1 }
                basisPoints: { type: number, example: 0.1 }
                percent: { type: number, example: 0.001 }
                appliesTo: { type: string, enum: [filled_notional_only] }
                signedInsideOrderAction: { type: boolean }
        intentHash: { type: string }
        expiresAt: { type: integer }
        timestamp: { type: integer }
        error: { type: string }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    CancelOrderRequest:
      type: object
      required: [agentAddress, coin, orderIds, nonce, expiresAt, intentHash, signature]
      properties:
        agentAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        coin: { type: string }
        orderIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: integer }
        signedAction: { type: object }
        nonce: { type: integer }
        expiresAt: { type: integer }
        intentHash: { type: string }
        signature:
          $ref: '#/components/schemas/EIP712Signature'

    CancelOrderResponse:
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string, enum: [accepted, rejected, partially_rejected, unknown], description: '`accepted` is application acknowledgement, not final venue cancellation.' }
        result:
          type: object
          properties:
            status: { type: string }
            response: { type: object }
        cancellation:
          type: object
          properties:
            accountAddress: { type: string }
            coin: { type: string }
            orderIds:
              type: array
              items: { type: integer }
            count: { type: integer }
            perOrder:
              type: array
              items:
                type: object
                properties:
                  orderId: { type: integer }
                  status: {}
        reconciliation:
          type: object
          description: Required handoff for final venue cancellation evidence.
          properties:
            required: { type: boolean, enum: [true] }
            endpoint: { type: string, enum: ['/api/v1/agent/futures/reconcile-order'] }
            orderIds:
              type: array
              items: { type: integer }
        intentHash: { type: string }
        expiresAt: { type: integer }
        timestamp: { type: integer }
        error: { type: string }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    # ── Autonomous Operator Schemas ──

    AgentMeta:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        framework: { type: string }
        capabilities:
          type: array
          items: { type: string }

    AutopilotConfig:
      type: object
      properties:
        strategies:
          type: array
          items:
            type: string
            enum: [funding_arb, momentum, mean_reversion, portfolio_rebalance, full_auto]
        assets:
          type: array
          items: { type: string }
        maxEquityPct: { type: number }
        rebalanceIntervalMin: { type: integer }
        autoCompound: { type: boolean }
        riskPreference:
          type: string
          enum: [conservative, balanced, aggressive]
        riskSentinel:
          $ref: '#/components/schemas/RiskSentinelConfig'
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaConfig'

    RiskSentinelConfig:
      type: object
      properties:
        minHealthFactor:
          type: number
        minLiquidationBufferPct:
          type: number
        maxStablecoinDepegPct:
          type: number

    ExecutionAlphaConfig:
      type: object
      properties:
        mevSafetyMode:
          $ref: '#/components/schemas/SwapSafetyMode'
        maxQuoteDecayBps:
          type: number
        maxGasUsdPerAction:
          type: number
        requirePositiveNetEdge:
          type: boolean
        minNetEdgeUsd:
          type: number

    RebalanceContext:
      type: object
      properties:
        expectedUpsideUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        gasUsd:
          type: number
          nullable: true
        riskBufferUsd:
          type: number
          nullable: true
        currentChain:
          type: string
          nullable: true
        targetChain:
          type: string
          nullable: true

    AutopilotRiskStatus:
      type: object
      properties:
        dailyPnlPct:
          type: number
        weeklyPnlPct:
          type: number
        drawdownPct:
          type: number
        openPositions:
          type: integer
        aggregateLeverage:
          type: number
        healthFactor:
          type: number
          nullable: true
        liquidationBufferPct:
          type: number
          nullable: true
        stablecoinDepegPct:
          type: number
          nullable: true
        quoteDecayBps:
          type: number
          nullable: true
        gasPerActionUsd:
          type: number
          nullable: true
        alerts:
          type: array
          items:
            type: string
        isTradingAllowed:
          type: boolean
        haltReason:
          type: string
          nullable: true

    TrackedPosition:
      type: object
      properties:
        coin: { type: string }
        side: { type: string, enum: [long, short] }
        entryPrice: { type: number }
        size: { type: number }
        leverage: { type: number }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        openedAt: { type: string, format: date-time }
        strategy: { type: string }
        unrealizedPnl: { type: number }

    DelegationRecord:
      type: object
      properties:
        ownerAddress: { type: string }
        apiWalletAddress: { type: string }
        verified: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }

    AgentSession:
      type: object
      properties:
        id: { type: string }
        agentAddress: { type: string }
        status: { type: string, enum: [active, paused, halted, expired] }
        delegation:
          $ref: '#/components/schemas/DelegationRecord'
        autopilot:
          $ref: '#/components/schemas/AutopilotConfig'
        activePositions:
          type: array
          items:
            $ref: '#/components/schemas/TrackedPosition'
        sessionPnl: { type: number }
        peakEquity: { type: number }
        tradeCount: { type: integer }
        lastHeartbeat: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        agentMeta:
          $ref: '#/components/schemas/AgentMeta'

    DelegationResponse:
      type: object
      properties:
        ok: { type: boolean }
        delegation:
          $ref: '#/components/schemas/DelegationRecord'
        message: { type: string }
        warning: { type: string }

    AutopilotAction:
      type: object
      properties:
        type:
          type: string
          enum: [analyze, execute, adjust_stop, close_position, rebalance, skip, halt]
        asset: { type: string }
        reason: { type: string }
        details: { type: object }
        priority: { type: string, enum: [high, medium, low] }

    OnboardResponse:
      type: object
      properties:
        ok: { type: boolean }
        welcome: { type: string }
        version: { type: string }
        quickStart:
          type: object
          properties:
            summary: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  step: { type: integer }
                  name: { type: string }
                  description: { type: string }
                  action: { type: string }
                  endpoint: { type: string, nullable: true }
                  required: { type: boolean }
        capabilities: { type: object }
        security: { type: object }
        autonomousWorkflow: { type: object }
        discovery: { type: object }
        pricing: { type: object }

