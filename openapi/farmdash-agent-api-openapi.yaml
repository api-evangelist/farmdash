        ok: { type: boolean }
        sizing:
          $ref: '#/components/schemas/PositionSizing'
        guardrails:
          type: object
          properties:
            maxLeverage: { type: integer }
            maxRiskPerTrade: { type: string }
            maxPositionValue: { type: string }
            note: { type: string }
        timestamp: { type: integer }

    EIP712Signature:
      type: object
      required: [r, s, v]
      properties:
        r: { type: string }
        s: { type: string }
        v: { type: integer }

    ExecuteOrderRequest:
      type: object
      required: [agentAddress, coin, isBuy, size, price, orderType, nonce, expiresAt, intentHash, signature]
      properties:
        agentAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        coin: { type: string }
        isBuy: { type: boolean }
        size: { type: string }
        price: { type: string }
        orderType:
          type: string
          enum: [limit_gtc, limit_ioc, limit_alo, market, stop_loss, take_profit]
        reduceOnly: { type: boolean, default: false }
        leverage:
          oneOf:
            - type: number
            - type: string
        signedAction:
          type: object
          description: 'If supplied, must contain the signed FarmDash builder term `{ b: treasury, f: 1 }`; f is tenths of a basis point.'
        nonce: { type: integer }
        expiresAt: { type: integer }
        intentHash: { type: string }
        signature:
          $ref: '#/components/schemas/EIP712Signature'

    ExecuteOrderResponse:
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string, enum: [filled, resting_unfilled, rejected, unknown] }
        result:
          type: object
          properties:
            status: { type: string }
            response: { type: object }
        order:
          type: object
          properties:
            coin: { type: string }
            side: { type: string, enum: [buy, sell] }
            size: { type: string }
            price: { type: string }
            type: { type: string }
            reduceOnly: { type: boolean }
            leverage: { type: number }
            leverageStatus: { type: string, enum: [risk_check_metadata_only] }
            builderFee:
              type: object
              properties:
                recipient: { type: string }
                venueUnitsTenthsBps: { type: number, example: 1 }
                basisPoints: { type: number, example: 0.1 }
                percent: { type: number, example: 0.001 }
                appliesTo: { type: string, enum: [filled_notional_only] }
                signedInsideOrderAction: { type: boolean }
        intentHash: { type: string }
        expiresAt: { type: integer }
        timestamp: { type: integer }
        error: { type: string }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    CancelOrderRequest:
      type: object
      required: [agentAddress, coin, orderIds, nonce, expiresAt, intentHash, signature]
      properties:
        agentAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        coin: { type: string }
        orderIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: integer }
        signedAction: { type: object }
        nonce: { type: integer }
        expiresAt: { type: integer }
        intentHash: { type: string }
        signature:
          $ref: '#/components/schemas/EIP712Signature'

    CancelOrderResponse:
      type: object
      properties:
        ok: { type: boolean }
        result:
          type: object
          properties:
            status: { type: string }
            response: { type: object }
        cancelled:
          type: object
          properties:
            coin: { type: string }
            orderIds:
              type: array
              items: { type: integer }
            count: { type: integer }
        intentHash: { type: string }
        expiresAt: { type: integer }
        timestamp: { type: integer }
        error: { type: string }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DustStormWarning'

    # ── Autonomous Operator Schemas ──

    AgentMeta:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        framework: { type: string }
        capabilities:
          type: array
          items: { type: string }

    AutopilotConfig:
      type: object
      properties:
        strategies:
          type: array
          items:
            type: string
            enum: [funding_arb, momentum, mean_reversion, portfolio_rebalance, full_auto]
        assets:
          type: array
          items: { type: string }
        maxEquityPct: { type: number }
        rebalanceIntervalMin: { type: integer }
        autoCompound: { type: boolean }
        riskPreference:
          type: string
          enum: [conservative, balanced, aggressive]
        riskSentinel:
          $ref: '#/components/schemas/RiskSentinelConfig'
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaConfig'

    RiskSentinelConfig:
      type: object
      properties:
        minHealthFactor:
          type: number
        minLiquidationBufferPct:
          type: number
        maxStablecoinDepegPct:
          type: number

    ExecutionAlphaConfig:
      type: object
      properties:
        mevSafetyMode:
          $ref: '#/components/schemas/SwapSafetyMode'
        maxQuoteDecayBps:
          type: number
        maxGasUsdPerAction:
          type: number
        requirePositiveNetEdge:
          type: boolean
        minNetEdgeUsd:
          type: number

    RebalanceContext:
      type: object
      properties:
        expectedUpsideUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        gasUsd:
          type: number
          nullable: true
        riskBufferUsd:
          type: number
          nullable: true
        currentChain:
          type: string
          nullable: true
        targetChain:
          type: string
          nullable: true

    AutopilotRiskStatus:
      type: object
      properties:
        dailyPnlPct:
          type: number
        weeklyPnlPct:
          type: number
        drawdownPct:
          type: number
        openPositions:
          type: integer
        aggregateLeverage:
          type: number
        healthFactor:
          type: number
          nullable: true
        liquidationBufferPct:
          type: number
          nullable: true
        stablecoinDepegPct:
          type: number
          nullable: true
        quoteDecayBps:
          type: number
          nullable: true
        gasPerActionUsd:
          type: number
          nullable: true
        alerts:
          type: array
          items:
            type: string
        isTradingAllowed:
          type: boolean
        haltReason:
          type: string
          nullable: true

    TrackedPosition:
      type: object
      properties:
        coin: { type: string }
        side: { type: string, enum: [long, short] }
        entryPrice: { type: number }
        size: { type: number }
        leverage: { type: number }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        openedAt: { type: string, format: date-time }
        strategy: { type: string }
        unrealizedPnl: { type: number }

    DelegationRecord:
      type: object
      properties:
        ownerAddress: { type: string }
        apiWalletAddress: { type: string }
        verified: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }

    AgentSession:
      type: object
      properties:
        id: { type: string }
        agentAddress: { type: string }
        status: { type: string, enum: [active, paused, halted, expired] }
        delegation:
          $ref: '#/components/schemas/DelegationRecord'
        autopilot:
          $ref: '#/components/schemas/AutopilotConfig'
        activePositions:
          type: array
          items:
            $ref: '#/components/schemas/TrackedPosition'
        sessionPnl: { type: number }
        peakEquity: { type: number }
        tradeCount: { type: integer }
        lastHeartbeat: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        agentMeta:
          $ref: '#/components/schemas/AgentMeta'

    DelegationResponse:
      type: object
      properties:
        ok: { type: boolean }
        delegation:
          $ref: '#/components/schemas/DelegationRecord'
        message: { type: string }
        warning: { type: string }

    AutopilotAction:
      type: object
      properties:
        type:
          type: string
          enum: [analyze, execute, adjust_stop, close_position, rebalance, skip, halt]
        asset: { type: string }
        reason: { type: string }
        details: { type: object }
        priority: { type: string, enum: [high, medium, low] }

    OnboardResponse:
      type: object
      properties:
        ok: { type: boolean }
        welcome: { type: string }
        version: { type: string }
        quickStart:
          type: object
          properties:
            summary: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  step: { type: integer }
                  name: { type: string }
                  description: { type: string }
                  action: { type: string }
                  endpoint: { type: string, nullable: true }
                  required: { type: boolean }
        capabilities: { type: object }
        security: { type: object }
        autonomousWorkflow: { type: object }
        discovery: { type: object }
        pricing: { type: object }

