openapi: 3.2.0
info:
  title: FarmDash Agent Swap API
  version: 2.0.0
  description: 'WARNING: Running trade executions and cancellations places real perpetual futures trades and alters active market exposure, carrying significant risk of financial loss. Immediate, explicit manual end-user confirmation and consent is strictly required immediately before placing any execution or cancellation request. Do not allow autonomous agents to auto-run trade execution or cancellation without manual user approval. FarmDash is an intelligence and control layer for DeFi agents and serious airdrop farmers. This API covers swap transaction preparation (Signal Architect),

    protocol discovery intelligence (Trail Heat), perpetual futures (Futures Strategist), portfolio

    research, bounded autonomous sessions, x402 payment flows, and agent-readable opportunity intelligence. FarmDash does not request seed phrases or raw wallet private keys. Compatibility

    swap routes do not custody funds; separately configured venue or MPC delegations

    remain subject to their provider controls and explicit policy bounds. ## Authentication & Credential Lifecycle

    | Tier | Price | Auth | Rate Limit | Key Prefix | Entitlements | Best for |

    |------|-------|------|------------|------------|--------------|----------|

    | Scout | Free | None | 30 req / 24 h per IP | `fd_scout_free` | Keyless public discovery and quotes | Keyless discovery and quotes |

    | Pioneer | $39.99/mo USDC | `Authorization: Bearer ` | 1,500 req / day | `fd_pio_` | Premium research, full Trail Heat, wallet analytics, sybil audits | Serious farmers, full datasets, sybil audits, wallet analytics |

    | Syndicate | $199/mo USDC | `Authorization: Bearer ` | 50,000 req / day | `fd_syn_` | All Pioneer features plus advanced control tooling, bounded autopilot, webhooks, unrestricted CORS | Teams, serious agents, high-volume API use, webhooks, unrestricted CORS, advanced control/session tooling |


    ### Paid Entitlement & Key Issuance Sequence:

    1. **Pay**: Transfer USDC ($39.99/mo for Pioneer, $199/mo for Syndicate) on Base, Arbitrum, Optimism, Polygon, Ethereum, or Linea to the FarmDash treasury. 2. **Verify**: Post transaction hash and wallet to `verify-payment` to record on-chain confirmation in `users` and `payment_events`. 3. **Sign Proof**: Sign an EIP-712 `ApiKeyRequest` with the paying wallet (domain: `FarmDash`, intent: `Issue FarmDash API key`, single-use `nonce`). 4. **Receive Credential**: Post the signed payload to `/api/v1/agent/api-key`. The credential tier is server-authoritative, derived exclusively from your active paid subscription (client input cannot downgrade or elevate your tier). The plaintext key is returned exactly once; FarmDash stores only a SHA-256 hash. 5. **Authenticate**: Send `Authorization: Bearer ` on all requests. Daily limits reset every 24 hours (`X-RateLimit-Remaining`). Keys expire with your 30-day subscription; expired keys return HTTP 402 Payment Required. Higher-tier Syndicate capabilities (`advanced_control`) remain blocked for Pioneer subscribers. For SDK development without live data, use the deterministic sandbox on

    the two endpoints that explicitly support it (`/v1/agent/protocols` and

    `/v1/trail-heat`):

    `?mock=true`, `X-FarmDash-Mock: true`, or `Authorization: Bearer fd_sandbox_mock`

    Quote mock requests return typed `mock_not_supported` without contacting a live provider. Swap execution requires a fresh successful preflight simulation plus an EIP-191 agent wallet signature. Futures execution requires an EIP-712 Hyperliquid wallet signature. ## Dust Storm Protocol

    On upstream failure, FarmDash returns `ok:false` with a typed degraded state

    and a `warnings` array containing `{ kind: "dust_storm", message: "..." }`. Cached SDK responses may be returned as stale with explicit stale-data age. ## x402 Payment Wall

    When Scout limits are exceeded, FarmDash returns HTTP 402 with

    `code: free_quota_exhausted`, `instruction: STOP_RETRYING`, the UTC reset time,

    upgrade URL, and x402 payment instructions.'
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT
servers:
- url: https://www.farmdash.one/api
  description: Production
tags:
- name: Swap
  description: Token swap quotes, execution, and confirmation
paths:
  /agents/quote:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getSwapQuote
      summary: Get a token swap quote
      description: 'Provider-neutral market estimate by default: returns an explicitly

        labelled `market_estimate` (reference price, approximate output,

        server fee tier, route compatibility, freshness) WITHOUT calling 0x,

        LI.FI, or Relay trading APIs. Browsing, polling, previews, and

        wallet-supplied GETs all receive estimation — a `walletAddress` alone

        is exploratory context, never execution intent, and never fans out

        into provider APIs. The estimate is intelligence, not a provider

        quote: no executable calldata, no provider attribution, no liquidity

        confirmation, never `executionReady: true`.

        For execution, POST `/v1/agent/quote-intent` with exact parameters, a

        real wallet, and an idempotency key to receive a firm single-provider

        quote bound to an `intentId`; then re-call this endpoint with the

        identical parameters plus `intentId` to serve the stored firm quote

        with zero new provider calls. Changed parameters never reuse a stale

        quote (`intent_params_changed`); unknown/expired intents return

        `intent_not_found`. One intent contacts exactly one primary provider;

        a sequential alternate follows only a genuine primary failure.

        0x quotes use the AllowanceHolder flow (standard approve + plain

        transaction); FarmDash does not support Permit2 EIP-712 signatures.

        `mock=true` is not supported and returns a typed 400 without contacting a provider.'
      tags:
      - Swap
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      - $ref: '#/components/parameters/FromChainId'
      - $ref: '#/components/parameters/ToChainId'
      - $ref: '#/components/parameters/FromToken'
      - $ref: '#/components/parameters/ToToken'
      - $ref: '#/components/parameters/FromAmount'
      - name: protocol
        in: query
        schema:
          type: string
          enum:
          - lifi
          - relay
        description: Force a specific routing protocol (auto-selected if omitted)
      - name: mock
        in: query
        schema:
          type: string
          enum:
          - 'true'
        description: Unsupported for quotes. Returns HTTP 400 mock_not_supported and never contacts a live quote provider.
      - name: walletAddress
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: Optional real wallet. Exploratory context only — a wallet alone never triggers provider quoting. For execution, POST /api/v1/agent/quote-intent.
      - name: toAddress
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: Optional destination wallet override. Must exactly match the stored intent when serving via intentId.
      - name: slippage
        in: query
        schema:
          type: number
          minimum: 0.01
          maximum: 5
        description: Optional slippage tolerance in percent
      - name: expectedUpsideUsd
        in: query
        schema:
          type: number
        description: Optional upside estimate used to enforce positive net edge
      - name: riskBufferUsd
        in: query
        schema:
          type: number
        description: Optional execution-risk haircut added to total route cost
      - name: healthFactor
        in: query
        schema:
          type: number
        description: Optional health factor used for halt checks
      - name: liquidationBufferPct
        in: query
        schema:
          type: number
        description: Optional liquidation buffer percentage used for halt checks
      - name: safetyMode
        in: query
        schema:
          $ref: '#/components/schemas/SwapSafetyMode'
        description: '`strict` halts on severe quote decay, `balanced` downgrades that condition to a warning'
      - name: intentId
        in: query
        schema:
          type: string
        description: Execution-intent ID from POST /api/v1/agent/quote-intent. Serves the stored firm quote with zero new provider calls when all other parameters exactly match the intent; mismatches return intent_params_changed, unknown IDs return intent_not_found.
      responses:
        '200':
          description: Swap quote
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MarketEstimateResponse'
                - $ref: '#/components/schemas/FirmQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          description: Unknown/expired intentId (intent_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Typed live quote provider degradation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /v1/agent/market-estimate:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getMarketEstimate
      summary: Get a provider-neutral market estimate
      description: 'Discovery intelligence for browsing, previews, polling, and walletless

        exploration. Returns an explicitly labelled market_estimate (reference

        price, approximate output, server fee tier, route compatibility,

        freshness) WITHOUT calling 0x, LI.FI, or Relay trading APIs. Never

        executable, never attributed, never liquidity-confirmed. For

        execution, POST /v1/agent/quote-intent.'
      tags:
      - Swap
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      - $ref: '#/components/parameters/FromChainId'
      - $ref: '#/components/parameters/ToChainId'
      - $ref: '#/components/parameters/FromToken'
      - $ref: '#/components/parameters/ToToken'
      - $ref: '#/components/parameters/FromAmount'
      responses:
        '200':
          description: Market estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketEstimateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/agent/quote-intent:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: createQuoteIntent
      summary: Create an execution intent with a firm single-provider quote
      description: 'Explicit execution intent. Requires exact chain pair, token pair,

        amount, real wallet/taker, destination, slippage, and a client

        idempotency key; the fee tier is resolved server-side before any

        provider call. One intent contacts exactly one primary provider; a

        sequential alternate follows only a genuine primary failure.

        Identical intents reuse the stored firm quote (HTTP 200 reused:true);

        changed parameters never reuse a stale quote. The firm quote flows

        through simulate, approval, and prepare without further provider

        quote requests. Quote is not execution; FarmDash never signs or

        broadcasts.

        Provider prerequisites (compatibility swaps):

        A firm quote reports readiness plus any provider prerequisite that must be

        satisfied before simulation. A prerequisite recipe is NOT an executable swap

        transaction and must never be passed directly into simulation.


        LI.FI: when approval.required is true, approval.spender is the spender

        FarmDash observed. FarmDash does not build or broadcast the ERC-20 approval

        transaction: the customer-controlled wallet must satisfy the ERC-20 allowance

        locally (standard approve(spender, amount)), wait for that transaction to

        confirm, then request a FRESH firm quote so FarmDash re-checks the wallet

        balance and allowance. Proceed only when executionReady is true. The zero

        address 0x0000000000000000000000000000000000000000 is the LI.FI native-token

        sentinel and requires no ERC-20 allowance; it is not WETH.


        Relay: providerExecutionPlan is an ORDERED recipe whose steps have kind

        approve, transaction, signature or unknown, and carry status, to, data,

        value and chainId; approve steps also carry approvalSpender and

        approvalAmount, and signature steps carry signatureKind with sign/post/check.

        Follow planContinuation: "re_quote_after_approval" means complete the

        approval locally then obtain a fresh quote;

        "execute_provider_plan_and_check" means execute the ordered sign/post/check

        recipe exactly as returned; "provider_recipe_unsupported" means stop and do

        not treat the recipe as executable. A required step of kind unknown remains

        blocking. Never flatten a multi-step recipe into its first transaction.

        When a value is unreadable FarmDash reports unknown rather than assuming the

        prerequisite is satisfied. Prerequisite completion is not settlement.'
      tags:
      - Swap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fromChainId
              - toChainId
              - fromToken
              - toToken
              - fromAmount
              - walletAddress
              - toAddress
              - slippage
              - idempotencyKey
              properties:
                fromChainId:
                  type: integer
                toChainId:
                  type: integer
                fromToken:
                  type: string
                toToken:
                  type: string
                fromAmount:
                  type: string
                walletAddress:
                  type: string
                toAddress:
                  type: string
                slippage:
                  type: number
                  minimum: 0.01
                  maximum: 5
                protocol:
                  type: string
                  enum:
                  - lifi
                  - relay
                idempotencyKey:
                  type: string
                continuationId:
                  type: string
                  format: uuid
                  description: Optional context correlation only; all existing admission and wallet authority requirements remain unchanged.
                executionTrialProof:
                  $ref: '#/components/schemas/ExecutionTrialProof'
                executionMode:
                  type: string
                  enum:
                  - USER_SIGNED
                  - BOUNDED_AUTONOMOUS
                sessionId:
                  type: string
                grantId:
                  type: string
                sessionToken:
                  type: string
      responses:
        '201':
          description: Firm quote bound to a new execution intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmQuoteResponse'
        '200':
          description: Stored firm quote reused for an identical intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: This idempotencyKey was already used for a materially different request (idempotency_conflict). Generate a new key for a new logical swap; retrying the same key never merges them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body too large. Execution-facing bodies are capped at 32 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Typed live quote provider degradation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/solana-quote:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getSolanaQuotePreview
      summary: Get a read-only Solana swap quote preview
      description: 'Returns explicitly non-authoritative Solana pricing intelligence via Jupiter. No authentication required.

        PREVIEW ONLY: the response cannot be executed through the compatibility swap API (Solana execution

        remains preview in the capability registry until an authoritative simulation adapter, Solana signing

        flow, receipt binding, and mainnet integration tests land). FarmDash never signs, builds, or broadcasts

        a transaction from this route.

        `mock=true` is not supported and returns a typed 400 without contacting a provider.'
      tags:
      - Swap
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      - name: inputMint
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        description: Input token mint (base58 Solana address)
      - name: outputMint
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        description: Output token mint (base58 Solana address)
      - name: amount
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: Input amount as a canonical base-unit integer string (no leading zeros)
      - name: slippageBps
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
        description: Optional slippage tolerance in basis points (default 50)
      - name: mock
        in: query
        schema:
          type: string
          enum:
          - 'true'
        description: Unsupported for previews. Returns HTTP 400 mock_not_supported and never contacts a live quote provider.
      responses:
        '200':
          description: Non-authoritative Solana quote preview
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - preview_only
                - authoritative
                - submissionAvailable
                - source
                - inputMint
                - outputMint
                - inAmount
                - outAmount
                properties:
                  ok:
                    type: boolean
                  continuation:
                    $ref: '#/components/schemas/ExecutionContinuation'
                  next_operation:
                    $ref: '#/components/schemas/ExecutionContinuationNextOperation'
                  preview_only:
                    type: boolean
                  authoritative:
                    type: boolean
                  submissionAvailable:
                    type: boolean
                  source:
                    type: string
                  inputMint:
                    type: string
                  outputMint:
                    type: string
                  inAmount:
                    type: string
                  outAmount:
                    type: string
                  priceImpactPct:
                    type: string
                    nullable: true
                  routeHops:
                    type: integer
                    nullable: true
                  quotedAt:
                    type: string
                    format: date-time
                  unsigned:
                    type: boolean
                  broadcast_by_farmdash:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          description: Typed Jupiter preview degradation (dust-storm contract)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Jupiter preview timed out (dust-storm contract, retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/simulate:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: simulateSwapExecution
      summary: Simulate a wallet-bound swap intent
      description: 'Mandatory pre-execution simulation gate for Signal Architect. The caller

        submits `simulationRequirements.intent_id` (`fd_intent_*`) returned by

        `POST /v1/agent/quote-intent` plus the signing wallet. Do not submit the

        top-level `intentId` (`qi_*`), which is the quote-cache/idempotency identity.

        FarmDash simulates the bound execution intent, caches the result for 60 seconds,

        and returns a `simulation_id` that `/agents/swap` requires.'
      tags:
      - Swap
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapSimulationRequest'
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Simulation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapSimulationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Intent and wallet mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /agents/swap:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: executeSwap
      summary: Prepare a signed compatibility-swap transaction
      description: 'Compatibility transaction-preparation endpoint. It requires a fresh successful

        `simulationId`, authenticates the customer wallet with EIP-191, validates the released

        provider boundary, and returns the exact prepared transaction payload.


        FarmDash does not broadcast the returned compatibility-swap transaction. The customer

        wallet signs and submits the transaction directly to the target network. The chosen

        aggregator or router protocol (automatic multi-provider routing:

        same-chain LI.FI + Relay; cross-chain LI.FI + Relay; 0x is operator-paused

        until reinstated and is never primary or fallback)

        executes the swap.


        **Signature canonicalization**: construct

        `v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}:{nonce}`

        after lowercasing every `0x`-prefixed field, including token addresses. Sign the exact

        UTF-8 string with EIP-191/personal_sign. A 428 simulation-gate response is evaluated before

        signature verification and does not prove the signature is valid.


        For LI.FI native ETH routes use the zero-address native-token sentinel, not the WETH contract.


        **Fee schedule** (combined routing target; LI.FI 25 bps platform component deducted, not stacked; gas/slippage excluded): 50 bps under $10k, 45 bps at $10k+, 40 bps at $100k+, 30 bps at $1M+.'
      tags:
      - Swap
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Executable swap with transaction calldata
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid signature or expired nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Swap halted by Risk Sentinel guardrails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapHaltResponse'
        '428':
          description: Missing, expired, failed, or mismatched preflight simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /agents/confirm:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: confirmSwap
      summary: Confirm swap execution with on-chain tx hash
      description: 'After broadcasting the swap transaction, confirm it here with the tx hash.

        FarmDash verifies the transaction on-chain (10s timeout with LRU cache)

        and marks the fee event as settled. Idempotent — safe to retry.'
      tags:
      - Swap
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      parameters:
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Confirmation result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '400':
          description: Malformed or invalid confirmation input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or malformed session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Ownership or token authorization failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Settlement conflict. Either the exact expected fee transfer failed verification, or the fee event was already confirmed using a DIFFERENT transaction hash (code already_confirmed_conflict). In the latter case the existing settlement is NOT replaced, and this is not a retry-with-the-new-hash condition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Unexpected internal confirmation failure (typed dust_storm). Settlement was not recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/solana-swap:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: prepareSolanaSwap
      summary: Prepare an unsigned Solana swap for local wallet signature
      description: Prepares a user-signable Solana transaction after server-side mint, quote, simulation, wallet, idempotency, trial-admission and authority checks. `continuationId` is optional non-authoritative context correlation only; it does not relax any existing requirement or grant signing/submission authority. An expired unsigned preparation returns non-retryable 410 `solana_preparation_expired`; obtain a fresh preparation with a new idempotency key. A submitted or ambiguous 409 is not safe to resubmit; reconcile authoritative state first. Retry a retryable 503 only with the same stable idempotency key.
      tags:
      - Swap
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolanaSwapPrepareRequest'
      responses:
        '200':
          description: Unsigned prepared transaction requiring the customer wallet signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaSwapPrepareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Preparation conflict or submitted/ambiguous state; do not resubmit until authoritative reconciliation
        '410':
          description: Unsigned preparation expired; obtain a fresh preparation with a new idempotency key
        '503':
          description: Durable Solana preparation or canonical resolver unavailable; retry only with the same stable idempotency key
components:
  schemas:
    ConfirmRequest:
      type: object
      required:
      - sessionId
      - agentAddress
      - feeEventId
      - txHash
      properties:
        sessionId:
          type: string
          description: Owning FarmDash session id (the session that owns the fee event).
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Session owner / customer wallet address.
        sessionToken:
          type: string
          description: 'Optional in this raw-HTTP schema: the session credential may be sent in the request body or via the X-FarmDash-Session-Token header. It authenticates the FarmDash session only; it is not wallet signing or transaction authority, and FarmDash never broadcasts the swap on the caller''s behalf.'
        feeEventId:
          type: string
          format: uuid
          description: FarmDash fee-event id associated with the prepared swap.
        txHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: 'On-chain transaction hash, which exists only after the customer-controlled wallet broadcast. A transaction hash alone is not confirmation: FarmDash verifies the canonical receipt/finality and the expected fee transfer before durable settlement is recorded.'
    NetEdgeAnalysis:
      type: object
      properties:
        expectedUpsideUsd:
          type: number
          nullable: true
        protocolFeeUsd:
          type: number
        gasUsd:
          type: number
        bridgeFeeUsd:
          type: number
        riskBufferUsd:
          type: number
        totalCostUsd:
          type: number
        netEdgeUsd:
          type: number
          nullable: true
        positive:
          type: boolean
          nullable: true
        enforced:
          type: boolean
    ExecutionAlphaReport:
      type: object
      properties:
        selectedProtocol:
          $ref: '#/components/schemas/SupportedProtocol'
        routeReason:
          type: string
        mevProtection:
          type: object
          properties:
            safetyMode:
              $ref: '#/components/schemas/SwapSafetyMode'
            actualSlippageBps:
              type: integer
            maxRecommendedSlippageBps:
              type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RouteCandidate'
        quoteDecay:
          $ref: '#/components/schemas/QuoteDecayMetrics'
        netEdge:
          $ref: '#/components/schemas/NetEdgeAnalysis'
    AllowanceStatus:
      type: object
      properties:
        spender:
          type: string
          nullable: true
        allowance:
          type: string
          nullable: true
        requiredAmount:
          type: string
        approvalNeeded:
          type: boolean
        overApproved:
          type: boolean
        source:
          type: string
          enum:
          - onchain
          - quote_fallback
          - unavailable
    PegCheck:
      type: object
      properties:
        tokenAddress:
          type: string
        symbol:
          type: string
        reference:
          type: string
          enum:
          - USD
          - ETH
        priceUsd:
          type: number
          nullable: true
        referencePriceUsd:
          type: number
          nullable: true
        deviationPct:
          type: number
          nullable: true
        alert:
          type: boolean
    SwapRequest:
      type: object
      required:
      - fromChainId
      - toChainId
      - fromToken
      - toToken
      - fromAmount
      - agentAddress
      - toAddress
      - simulationId
      - nonce
      - signature
      properties:
        fromChainId:
          type: integer
          enum:
          - 1
          - 10
          - 137
          - 8453
          - 42161
          - 59144
        toChainId:
          type: integer
          enum:
          - 1
          - 10
          - 137
          - 8453
          - 42161
          - 59144
        fromToken:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        toToken:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        fromAmount:
          type: string
          pattern: ^\d+$
          description: Amount in wei
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Agent wallet address (signer)
        toAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Destination wallet for swapped tokens
        slippage:
          type: number
          minimum: 0.01
          maximum: 5
          default: 0.5
          description: Slippage tolerance in percent (capped at 5%)
        protocol:
          type: string
          enum:
          - lifi
          - relay
        volumeHintUSD:
          type: number
          description: Advisory telemetry only — never determines the fee tier. Fee BPS uses server-oracle-derived input volume exclusively (50 bps under $10k, 45 bps at $10k+, 40 bps at $100k+, 30 bps at $1M+ combined routing target); unknown volume pays the default tier.
        expectedUpsideUsd:
          type: number
          description: Optional upside estimate in USD for positive-net-edge checks
        riskBufferUsd:
          type: number
          description: Optional extra execution-risk buffer in USD
        healthFactor:
          type: number
          description: Optional lending health factor supplied by the caller
        liquidationBufferPct:
          type: number
          description: Optional liquidation-buffer percentage supplied by the caller
        walletAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Optional wallet address used for on-chain approval checks
        safetyMode:
          $ref: '#/components/schemas/SwapSafetyMode'
          description: '`strict` halts on severe quote decay, `balanced` downgrades that condition to a warning'
        simulationId:
          type: string
          description: Fresh successful simulation_id from POST /v1/simulate
        intentId:
          type: string
          description: Optional qi_* quote-cache/idempotency identity; must match the simulation when supplied. Do not pass this value to /v1/simulate.
        nonce:
          type: string
          description: Current timestamp in milliseconds (60s window)
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]{130}$
          description: EIP-191 personal_sign of the v1 versioned payload
    FirmQuoteResponse:
      type: object
      required:
      - intentId
      - quoteKind
      - reused
      - selectedProvider
      - firmQuote
      - expiresAt
      - executionReady
      - simulationRequirements
      - attempts
      - alternateUsed
      - unsigned
      - broadcast_by_farmdash
      - executionAlpha
      - riskReport
      - execution_boundary
      - note
      properties:
        intentId:
          type: string
        quoteKind:
          type: string
          enum:
          - firm_quote
        reused:
          type: boolean
        marketBenchmark:
          type: object
          nullable: true
        selectedProvider:
          $ref: '#/components/schemas/SupportedProtocol'
        firmQuote:
          type: object
        expiresAt:
          type: string
        executionReady:
          type: boolean
        approval:
          type: object
          nullable: true
        simulationRequirements:
          type: object
          properties:
            required:
              type: boolean
            simulate_url:
              type: string
            intent_id:
              type: string
              description: fd_intent_* execution-simulation identity. Pass this value to /v1/simulate.
            valid_for_execution:
              type: boolean
            plan:
              type: object
              nullable: true
            signatures:
              type: array
              nullable: true
        attempts:
          type: array
          items:
            type: object
        alternateUsed:
          type: boolean
        unsigned:
          type: boolean
          enum:
          - true
        broadcast_by_farmdash:
          type: boolean
          enum:
          - false
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'
        execution_boundary:
          type: object
          properties:
            state:
              type: string
            simulation_required:
              type: boolean
            local_signature_required:
              type: boolean
            farmdash_broadcasts_transaction:
              type: boolean
        note:
          type: string
    SwapHaltResponse:
      type: object
      properties:
        error:
          type: string
          example: swap_halted
        code:
          type: string
          example: swap_halted
        selectedProtocol:
          $ref: '#/components/schemas/SupportedProtocol'
        executionAlpha:
          $ref: '#/components/schemas/ExecutionAlphaReport'
        riskReport:
          $ref: '#/components/schemas/SwapRiskReport'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    SupportedProtocol:
      type: string
      enum:
      - lifi
      - relay
      description: Swap quote provider. Automatic routing compares all healthy compatible providers (LI.FI, Relay; 0x paused until reinstated); force one with ?protocol= (deterministic, never silent fallback).
    RouteCandidate:
      type: object
      properties:
        protocol:
          $ref: '#/components/schemas/SupportedProtocol'
        estimatedOutput:
          type: string
        feeAmountUsd:
          type: number
        gasEstimateUsd:
          type: number
          nullable: true
        bridgeFeeUsd:
          type: number
          nullable: true
        routeRiskScore:
          type: number
        selected:
          type: boolean
    QuoteDecaySeverity:
      type: string
      enum:
      - none
      - low
      - medium
      - high
    SolanaSwapPrepareRequest:
      type: object
      additionalProperties: false
      required:
      - wallet
      - inputMint
      - outputMint
      - amount
      properties:
        wallet:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        inputMint:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        outputMint:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        amount:
          type: string
          pattern: ^[1-9][0-9]*$
        continuationId:
          type: string
          format: uuid
          description: Optional context correlation only; does not create or change wallet authority.
        slippageBps:
          type: integer
          minimum: 1
          maximum: 500
        minAmountOut:
          type: string
          pattern: ^[1-9][0-9]*$
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
        executionTrialProof:
          $ref: '#/components/schemas/ExecutionTrialProof'
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
        sessionId:
          type: string
        grantId:
          type: string
        sessionToken:
          type: string
        signerPubkey:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
    PaymentRequiredError:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: payment_required
        code:
          type: string
          description: '`free_quota_exhausted` when the shared Scout allowance is spent; otherwise `payment_required`.'
          example: free_quota_exhausted
        message:
          type: string
        instruction:
          type: string
          enum:
          - STOP_RETRYING
          description: Present when an exhausted free caller must not repeat the same unpaid request.
        retry_same_request:
          type: boolean
          example: false
        next_action:
          type: string
          example: Wait for your quota reset, upgrade your plan, or use x402 paid access.
        quota:
          type: object
          properties:
