      - liquidityConfirmed
      - priceUnknown
      - feeTierBps
      - volumeUnknown
      - compatibleProviders
      - routeSupported
      - sources
      - confidence
      - observedAt
      - cached
      - stale
      - unsigned
      - broadcast_by_farmdash
