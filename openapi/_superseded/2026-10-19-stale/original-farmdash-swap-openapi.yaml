openapi: 3.0.3
info:
  title: FarmDash Signal Architect API
  version: 1.2.0
  description: |
    Core REST API for payment-enabled AI agents to query DeFi discovery intelligence,
    request token swap quotes, prepare customer-approved EVM swap transactions, handle
    x402 API payment flows, and inspect fee history.

    FarmDash operates on a zero-custody model. Compatibility-swap routing currently uses
    LI.FI and Relay only. 0x is operator-paused until reinstated and is never
    selected as primary or fallback. x402 is HTTP machine-payment/access infrastructure, not a swap
    execution provider. FarmDash does not broadcast compatibility-swap transactions;
    the customer wallet controls signing and submission.

    ## Authentication
    - **Scout (Free)**: No auth. 30 requests/24h per IP.
    - **Pioneer**: `Authorization: Bearer <PIONEER_KEY>`. 1,500 requests/day.
    - **Syndicate**: `Authorization: Bearer <SYNDICATE_KEY>`. 50,000 requests/day.
    - **Firm quote intent**: POST `https://www.farmdash.one/api/v1/agent/quote-intent` with exact parameters, a real wallet, and an idempotency key. The response has two intentionally different identifiers: top-level `intentId` is the `qi_*` quote-cache/idempotency id; `simulationRequirements.intent_id` is the `fd_intent_*` execution-simulation id.
    - **Swap simulation**: POST `https://www.farmdash.one/api/v1/simulate` with the `fd_intent_*` value from `simulationRequirements.intent_id` plus the signing wallet.
    - **Swap preparation**: POST `https://www.farmdash.one/api/agents/swap` with a fresh successful `simulationId` plus an EIP-191 customer-wallet signature.
    - OpenAPI paths are relative to `servers[0].url = https://www.farmdash.one/api`; for example `/agents/quote` means `https://www.farmdash.one/api/agents/quote`, not the website route `https://www.farmdash.one/agents/quote`.

    ## State semantics
    Quote preview, prepared transaction, submitted transaction, and confirmed settlement are
    distinct states. Returning transaction calldata is evidence of preparation only. FarmDash
    does not report confirmation without canonical receipt/finality verification.

    ## Dust Storm Protocol
    If an upstream API fails, FarmDash returns a typed error or a previously validated stale
    response with a warning. Missing data is never converted into synthetic success or zero.

    ## x402 Payment Wall
    When free-tier limits are exceeded, responses may include x402 payment requirements for a
    USDC machine payment on Base that unlocks the API request. This payment mechanism is separate
    from LI.FI/Relay swap routing.
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT

servers:
  - url: https://www.farmdash.one/api
    description: Production

paths:
  /v1/agent/protocols:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getProtocolCatalog
      summary: Get catalog protocol directory (discovery heuristic scores)
      description: |
        Returns the curated FarmDash protocol catalog with EDITORIAL discovery heuristic scores
        (catalog-editorial-v1). These are not live Trail Heat; canonical quantitative scores are
        served by `/v1/trail-heat`.
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Protocol dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolsResponse'
        '402':
          description: Free-tier limit exceeded — x402 API payment required
          headers:
            X-Payment-Required:
              schema: { type: string }
            X-Payment-Address:
              schema: { type: string }
              description: Treasury wallet (USDC on Base)
            X-Payment-Token:
              schema: { type: string }
              description: USDC contract on Base
            X-Payment-Amount:
              schema: { type: string }
              description: Amount in token base units
            X-Payment-Chain-Id:
              schema: { type: string }
              description: '8453 (Base)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
        '429':
          description: Rate limit exceeded

  /v1/agent/chain-breakdown:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getChainBreakdown
      summary: Get protocol distribution by chain
      tags: [Intelligence]
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Chain breakdown data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainBreakdownResponse'
        '402':
          description: Free-tier limit exceeded
        '429':
          description: Rate limit exceeded

  /agents/quote:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getSwapQuote
      summary: Get a token swap quote without executing
      description: |
        Discovery endpoint. By default this returns a provider-neutral market estimate and NEVER
        creates an executable simulation intent, even when `walletAddress` is supplied.
        For execution, first POST `/v1/agent/quote-intent`. That response returns a top-level
        `intentId` (`qi_*`, quote-cache/idempotency identity) and
        `simulationRequirements.intent_id` (`fd_intent_*`, the value required by `/v1/simulate`).
        Re-call this GET only with the `qi_*` `intentId` plus identical parameters to retrieve
        the stored firm quote without a new provider call.

        Released provider boundary:
        - LI.FI: cross-chain and same-chain EVM compatibility routes.
        - Relay: cross-chain and same-chain EVM compatibility routes.
        - 0x: operator-paused until reinstated; never selectable as primary or fallback.

        x402 and OKX are not compatibility-swap routing providers.
      tags: [Swap]
      parameters:
        - in: query
          name: fromChainId
          required: true
          schema: { type: integer }
          description: Source EVM chain ID
        - in: query
          name: toChainId
          required: true
          schema: { type: integer }
          description: Destination EVM chain ID
        - in: query
          name: fromToken
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: Source token contract address
        - in: query
          name: toToken
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: Destination token contract address
        - in: query
          name: fromAmount
          required: true
          schema: { type: string, pattern: '^\d+$' }
          description: Amount in token base units
        - in: query
          name: protocol
          required: false
          schema:
            type: string
            enum: [lifi, relay]
          description: Force a released compatibility provider (LI.FI or Relay); auto-selected if omitted. 0x is operator-paused and cannot be forced.
        - in: query
          name: walletAddress
          required: false
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: Optional discovery context. Supplying walletAddress alone does not create an execution/simulation intent; use POST /v1/agent/quote-intent for that.
        - in: query
          name: toAddress
          required: false
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
          description: Destination wallet for output tokens; defaults to walletAddress
        - in: query
          name: slippage
          required: false
          schema: { type: number, minimum: 0.01, maximum: 5 }
          description: Slippage tolerance in percent. Must match the stored firm intent when intentId is supplied.
        - in: query
          name: intentId
          required: false
          schema: { type: string, pattern: '^qi_' }
          description: qi_* quote-cache/idempotency identity from POST /v1/agent/quote-intent. With otherwise identical parameters, serves the stored firm quote without a new provider call.
      responses:
        '200':
          description: Discovery market estimate or stored firm quote
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MarketEstimateResponse'
                  - $ref: '#/components/schemas/FirmQuoteIntentResponse'
        '400':
          description: Invalid or unsupported parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: API access payment required; this does not select x402 as a swap provider
        '429':
          description: Rate limit exceeded

  /v1/agent/quote-intent:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: createQuoteIntent
      summary: Create an execution intent with a firm single-provider quote
      description: |
        This is the execution entrypoint. Requires exact chain/token/amount parameters, a real
        wallet and destination, slippage, and an idempotency key. The response deliberately carries
        two IDs: top-level `intentId` is `qi_*` quote-cache/idempotency identity;
        `simulationRequirements.intent_id` is the `fd_intent_*` value required by `/v1/simulate`.
        FarmDash does not sign or broadcast.
      tags: [Swap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromChainId, toChainId, fromToken, toToken, fromAmount, walletAddress, toAddress, slippage, idempotencyKey]
              properties:
                fromChainId: { type: integer }
                toChainId: { type: integer }
                fromToken: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
                toToken: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
                fromAmount: { type: string, pattern: '^\d+$' }
                walletAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
                toAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
                slippage: { type: number, minimum: 0.01, maximum: 5 }
                protocol: { type: string, enum: [lifi, relay] }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: New firm quote intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmQuoteIntentResponse'
        '200':
          description: Identical intent reused without another provider quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmQuoteIntentResponse'
        '400':
          description: Invalid request
        '402':
          description: API access payment required
        '409':
          description: Idempotency key conflict
        '413':
          description: Request body too large
        '429':
          description: Rate limit or shared execution-governor budget
        '502':
          description: Typed live quote provider degradation

  /v1/simulate:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: simulateSwap
      summary: Simulate a wallet-bound compatibility quote intent
      description: |
        Mandatory pre-preparation simulation. Submit the `fd_intent_*` value from
        `POST /v1/agent/quote-intent -> simulationRequirements.intent_id` plus the signing wallet.
        Do NOT submit the top-level `qi_*` `intentId`; that is the quote-cache/idempotency identity.
        `/agents/swap` rejects missing, failed, expired, or mismatched simulations.
        An API/payment failure is not reported as a blockchain revert.

        Naming mapping: this REST body is snake_case (`intent_id`, `wallet_address`);
        the MCP tool `simulate_swap_execution` takes the camelCase equivalents
        (`intentId`, `walletAddress`). The server accepts either casing on this
        endpoint; the MCP schema above is the machine-enforced camelCase form.
      tags: [Swap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapSimulationRequest'
      responses:
        '200':
          description: Authoritative compatibility preflight result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapSimulationResponse'
        '400':
          description: Invalid request
        '404':
          description: Quote intent not found or expired
        '409':
          description: Wallet mismatch or authoritative simulation failure
        '402':
          description: API access/payment gate; preflight was not run

  /agents/swap:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: executeSwap
      summary: Prepare a signed compatibility-swap transaction
      description: |
        Compatibility transaction-preparation endpoint. It requires a fresh successful
        `simulationId`, authenticates the customer wallet with EIP-191, validates the released
        provider boundary, and returns the exact prepared transaction payload.

        FarmDash does not broadcast the returned compatibility-swap transaction. The customer
        wallet remains responsible for signing/submission to the selected LI.FI or Relay route.
        A successful response means **prepared**, not submitted or confirmed.

        Signing payload:
        `v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}:{nonce}`

        Canonicalization is part of the wire contract: before joining the fields, lowercase every
        value that begins with `0x` — including `fromToken`, `toToken`, `agentAddress`, and
        `toAddress`. Numeric/string amounts and nonce are not case-transformed. Sign the resulting
        exact UTF-8 string with EIP-191/personal_sign.

        Gate ordering: a 428 stale/missing-simulation response occurs before signature verification;
        it is NOT evidence that the supplied signature is valid.

        Native EVM asset note: for LI.FI native ETH routes, use
        `0x0000000000000000000000000000000000000000` as the token sentinel. Supplying the WETH
        contract asks FarmDash/LI.FI to treat the input as ERC-20 WETH and may require WETH balance/approval.
      tags: [Swap]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      responses:
        '200':
          description: Prepared customer-broadcast transaction payload; not submission or confirmation evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuote'
        '400':
          description: Validation or unsupported-route error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid signature or expired nonce
        '428':
          description: Fresh successful simulation required
        '402':
          description: API access payment required
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }

  /agents/history:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getSwapHistory
      summary: Get your own compatibility fee-event history (tenant-bound)
      description: |
        Returns paginated fee-event records owned by the wallet bound to your
        API key. Requires a Pioneer or Syndicate bearer key; anonymous/scout
        callers receive 401 authentication_required. Any agentAddress that
        differs from the authenticated wallet returns 403 cross_tenant_denied.
        Preparation events, legacy execution-labeled rows,
        and canonically confirmed settlement evidence must not be treated as interchangeable.
        For public leaderboard data use GET /v1/leaderboard (aggregates only).
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: agentAddress
          required: false
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0 }
        - in: query
          name: metrics
          required: false
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: History events or aggregate metrics
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HistoryResponse'
                  - $ref: '#/components/schemas/RevenueMetrics'
        '402':
          description: API access payment required
        '429':
          description: Rate limit exceeded

components:
  parameters:
    X-FarmDash-Installation-ID:
      name: X-FarmDash-Installation-ID
      in: header
      required: false
      description: Optional analytics-only locally generated UUIDv4 installation hint. Stored only as a domain-separated salted hash. Not authentication, principal proof, quota, payment, wallet ownership, delegation or transaction authority. Omission changes no functionality.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    X-FarmDash-Client:
      name: X-FarmDash-Client
      in: header
      required: false
      description: Optional untrusted analytics client hint; never security evidence.
      schema:
        type: string
        enum:
          - mcp
          - ts_agent_kit
          - python_agent_kit
          - public_client
          - webapp
    X-FarmDash-Client-Version:
      name: X-FarmDash-Client-Version
      in: header
      required: false
      description: Optional analytics client version; never security evidence.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._+-]{1,64}$
    X-FarmDash-Skill-Version:
      name: X-FarmDash-Skill-Version
      in: header
      required: false
      description: Optional event-touch analytics skill version, alongside X-ClawHub-Skill; never security evidence.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._+-]{1,64}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Pioneer or Syndicate API key

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object, additionalProperties: true }

    PaymentRequiredError:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        direct_upgrade_url: { type: string, format: uri }
        payment_required:
          type: object
          properties:
            amount: { type: string }
            chain: { type: string, example: Base }
            destination: { type: string }

    ProtocolItem:
      type: object
      properties:
        protocol_name: { type: string }
        discovery_heuristic_score:
          oneOf:
            - type: number
            - type: string
        sybil_risk: { type: string }
        tvl:
          oneOf:
            - type: string
            - type: number
        category: { type: string }
        status: { type: string }
        chains:
          type: array
          items: { type: string }
        recommended_agent_deploy_link:
          type: string
          nullable: true

    ProtocolsResponse:
      type: object
      required: [tier, count, data]
      properties:
        tier:
          type: string
          enum: [scout, pioneer, syndicate]
        count: { type: integer }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolItem'
        status: { type: string }
        message: { type: string }
        direct_upgrade_url: { type: string, format: uri }
        total_protocols_available: { type: integer }

    ChainBreakdownItem:
      type: object
      properties:
        chain: { type: string }
        protocol_count:
          oneOf:
            - type: integer
            - type: string
        pct_of_total:
          oneOf:
            - type: number
            - type: string
        confirmed_airdrops:
          oneOf:
            - type: integer
            - type: string
        points_programs:
          oneOf:
            - type: integer
            - type: string
        categories:
          type: array
          items: { type: string }

    ChainBreakdownSummary:
      type: object
      properties:
        total_chains: { type: integer }
        total_protocols:
          oneOf:
            - type: integer
            - type: string
        dominant_chain:
          type: string
          nullable: true
        dominant_chain_pct:
          oneOf:
            - type: number
            - type: string

    ChainBreakdownResponse:
      type: object
      required: [tier, data]
      properties:
        tier:
          type: string
          enum: [scout, pioneer, syndicate]
        status: { type: string }
        message: { type: string }
        direct_upgrade_url: { type: string, format: uri }
        data:
          type: object
          properties:
            chains:
              type: array
              items:
                $ref: '#/components/schemas/ChainBreakdownItem'
            summary:
              $ref: '#/components/schemas/ChainBreakdownSummary'

    SwapTxData:
      type: object
      required: [to, data, value, chainId]
      properties:
        to:
          type: string
          description: Released provider transaction target; not a FarmDash custody address
        data:
          type: string
          description: Encoded transaction calldata
        value:
          type: string
          description: Native token value in base units
        chainId: { type: integer }

    SwapQuote:
      type: object
      required: [protocol, estimatedOutput, feeBps, feeAmountUSD, gasEstimate, txData, expiresAt]
      properties:
        protocol:
          type: string
          enum: [lifi, relay]
          description: Provider that produced this quote. Only released providers are ever selected; 0x is operator-paused.
        estimatedOutput: { type: string }
        feeBps: { type: integer }
        feeAmountUSD: { type: string }
        gasEstimate: { type: string }
        txData:
          $ref: '#/components/schemas/SwapTxData'
        expiresAt:
          type: integer
          description: Quote/preparation expiry timestamp in milliseconds

    SwapQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/SwapQuote'
        - type: object
          properties:
            note:
              type: string
              example: 'Unsigned preview. Simulate, authenticate, then request prepared calldata; the customer wallet broadcasts.'
            simulation_required: { type: boolean }
            simulation_available: { type: boolean }
            intent_id:
              type: string
              nullable: true
            intent_expires_at:
              type: string
              nullable: true
            simulate_url: { type: string }

    MarketEstimateResponse:
      type: object
      required: [quoteKind, executionReady, liquidityConfirmed, priceUnknown, feeTierBps, volumeUnknown, compatibleProviders, routeSupported, sources, confidence, observedAt, cached, stale, unsigned, broadcast_by_farmdash]
      properties:
        quoteKind:
          type: string
          enum: [market_estimate]
        executionReady:
          type: boolean
          enum: [false]
        liquidityConfirmed:
          type: boolean
          enum: [false]
        providerAttribution:
          type: string
          nullable: true
        referencePriceUsd:
          type: number
          nullable: true
        estimatedInputUsd:
          type: number
          nullable: true
        estimatedOutputUsd:
          type: number
          nullable: true
        priceUnknown: { type: boolean }
        feeTierBps: { type: integer }
        volumeUnknown: { type: boolean }
        compatibleProviders:
          type: array
          items: { type: string }
        routeSupported: { type: boolean }
        sources:
          type: array
          items: { type: string }
        confidence:
          type: string
          enum: [high, medium, low]
        observedAt: { type: string }
        cached: { type: boolean }
        stale: { type: boolean }
        unsigned:
          type: boolean
          enum: [true]
        broadcast_by_farmdash:
          type: boolean
          enum: [false]
        note: { type: string }

    FirmQuoteIntentResponse:
      type: object
      required: [intentId, quoteKind, selectedProvider, firmQuote, executionReady, simulationRequirements, unsigned, broadcast_by_farmdash]
      properties:
        intentId:
          type: string
          pattern: '^qi_'
          description: Quote-cache/idempotency identity. Not the simulation input.
        quoteKind:
          type: string
          enum: [firm_quote]
        reused: { type: boolean }
        selectedProvider:
          type: string
          enum: [lifi, relay]
        firmQuote:
          type: object
          additionalProperties: true
        executionReady: { type: boolean }
        approval:
          type: object
          nullable: true
        simulationRequirements:
          type: object
          required: [required, simulate_url, intent_id, valid_for_execution]
          properties:
            required: { type: boolean }
            simulate_url: { type: string, example: '/api/v1/simulate' }
            intent_id:
              type: string
              pattern: '^fd_intent_'
              description: Execution-simulation identity. Pass this exact value to /v1/simulate.
            valid_for_execution: { type: boolean }
            plan:
              type: object
              nullable: true
            signatures:
              type: array
              nullable: true
        unsigned:
          type: boolean
          enum: [true]
        broadcast_by_farmdash:
          type: boolean
          enum: [false]

    SwapSimulationRequest:
      type: object
      required: [intent_id, wallet_address]
      properties:
        intent_id:
          type: string
          pattern: '^fd_intent_[a-f0-9]+$'
        wallet_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'

    SwapSimulationResponse:
      type: object
      required: [ok, simulation_id, intent_id, success, valid_until]
      properties:
        ok: { type: boolean }
        simulation_id: { type: string }
        intent_id: { type: string }
        success: { type: boolean }
        gas_used: { type: number }
        gas_cost_usd: { type: number }
        output_amount: { type: string }
        price_impact_pct:
          type: number
          nullable: true
        mev_risk:
          type: string
          enum: [low, medium, high]
        revert_reason:
          type: string
          nullable: true
        valid_until:
          type: string
          format: date-time

    SwapRequest:
      type: object
      required: [fromChainId, toChainId, fromToken, toToken, fromAmount, agentAddress, toAddress, simulationId, nonce, signature]
      properties:
        fromChainId: { type: integer }
        toChainId: { type: integer }
        fromToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        toToken:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        fromAmount:
          type: string
          pattern: '^\d+$'
        agentAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Customer wallet address that signs the request
        toAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        simulationId: { type: string }
        intentId: { type: string }
        slippage:
          type: number
          minimum: 0.01
          maximum: 5
          default: 0.5
        protocol:
          type: string
          enum: [lifi, relay]
          description: Released provider this preparation is bound to. 0x is operator-paused and not a valid value.
        nonce: { type: string }
        signature:
          type: string
          pattern: '^0x[a-fA-F0-9]+$'

    FeeEvent:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        protocol:
          type: string
          description: >
            Raw fee-event protocol/source identifier. Current compatibility-swap rows use LI.FI or Relay.
            Historical rows may include zerox, x402, Hyperliquid, and other legacy values; generic
            intent-fee rows may use intent:<protocolId>. This field is historical/accounting data and
            must not be interpreted as the current released swap-provider set.
        from_token: { type: string }
        to_token: { type: string }
        volume_usd: { type: number }
        fee_bps: { type: integer }
        fee_usd: { type: number }
        agent_address: { type: string }
        tx_hash:
          type: string
          nullable: true

    HistoryResponse:
      type: object
      required: [events, total, limit, offset]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/FeeEvent'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    RevenueMetrics:
      type: object
      required: [totalFeeUSD, totalVolumeUSD, totalSwaps, activeAgents]
      properties:
        totalFeeUSD:
          type: number
          description: Aggregate recorded fee amount; use event state/receipt evidence before treating as settled revenue
        totalVolumeUSD:
          type: number
          description: Aggregate recorded volume associated with fee events
        totalSwaps:
          type: integer
          description: Aggregate recorded fee-event count; not itself proof of confirmed on-chain execution
        activeAgents:
          type: integer
          description: Unique recorded customer wallet addresses
