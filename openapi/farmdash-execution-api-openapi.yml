                b:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                f:
                  type: integer
                  enum:
                  - 1
                basisPoints:
                  type: number
                  enum:
                  - 0.1
                approvedMaximumVenueUnitsTenthsBps:
                  type: integer
                  minimum: 1
        typedData:
          type: object
          required:
          - domain
          - types
          - primaryType
          - message
          properties:
            domain:
              type: object
              required:
              - name
              - version
              - chainId
              - verifyingContract
