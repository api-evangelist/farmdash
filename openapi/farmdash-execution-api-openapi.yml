openapi: 3.2.0
info:
  title: FarmDash Agent Execution API
  version: 2.0.0
  description: 'WARNING: Running trade executions and cancellations places real perpetual futures trades and alters active market exposure, carrying significant risk of financial loss. Immediate, explicit manual end-user confirmation and consent is strictly required immediately before placing any execution or cancellation request. Do not allow autonomous agents to auto-run trade execution or cancellation without manual user approval. FarmDash is an intelligence and control layer for DeFi agents and serious airdrop farmers. This API covers swap transaction preparation (Signal Architect),

    protocol discovery intelligence (Trail Heat), perpetual futures (Futures Strategist), portfolio

    research, bounded autonomous sessions, x402 payment flows, and agent-readable opportunity intelligence. FarmDash does not request seed phrases or raw wallet private keys. Compatibility

    swap routes do not custody funds; separately configured venue or MPC delegations

    remain subject to their provider controls and explicit policy bounds. ## Authentication & Credential Lifecycle

    | Tier | Price | Auth | Rate Limit | Key Prefix | Entitlements | Best for |

    |------|-------|------|------------|------------|--------------|----------|

    | Scout | Free | None | 30 req / 24 h per IP | `fd_scout_free` | Keyless public discovery and quotes | Keyless discovery and quotes |

    | Pioneer | $39.99/mo USDC | `Authorization: Bearer ` | 1,500 req / day | `fd_pio_` | Premium research, full Trail Heat, wallet analytics, sybil audits | Serious farmers, full datasets, sybil audits, wallet analytics |

    | Syndicate | $199/mo USDC | `Authorization: Bearer ` | 50,000 req / day | `fd_syn_` | All Pioneer features plus advanced control tooling, bounded autopilot, webhooks, unrestricted CORS | Teams, serious agents, high-volume API use, webhooks, unrestricted CORS, advanced control/session tooling |


    ### Paid Entitlement & Key Issuance Sequence:

    1. **Pay**: Transfer USDC ($39.99/mo for Pioneer, $199/mo for Syndicate) on Base, Arbitrum, Optimism, Polygon, Ethereum, or Linea to the FarmDash treasury. 2. **Verify**: Post transaction hash and wallet to `verify-payment` to record on-chain confirmation in `users` and `payment_events`. 3. **Sign Proof**: Sign an EIP-712 `ApiKeyRequest` with the paying wallet (domain: `FarmDash`, intent: `Issue FarmDash API key`, single-use `nonce`). 4. **Receive Credential**: Post the signed payload to `/api/v1/agent/api-key`. The credential tier is server-authoritative, derived exclusively from your active paid subscription (client input cannot downgrade or elevate your tier). The plaintext key is returned exactly once; FarmDash stores only a SHA-256 hash. 5. **Authenticate**: Send `Authorization: Bearer ` on all requests. Daily limits reset every 24 hours (`X-RateLimit-Remaining`). Keys expire with your 30-day subscription; expired keys return HTTP 402 Payment Required. Higher-tier Syndicate capabilities (`advanced_control`) remain blocked for Pioneer subscribers. For SDK development without live data, use the deterministic sandbox on

    the two endpoints that explicitly support it (`/v1/agent/protocols` and

    `/v1/trail-heat`):

    `?mock=true`, `X-FarmDash-Mock: true`, or `Authorization: Bearer fd_sandbox_mock`

    Quote mock requests return typed `mock_not_supported` without contacting a live provider. Swap execution requires a fresh successful preflight simulation plus an EIP-191 agent wallet signature. Futures execution requires an EIP-712 Hyperliquid wallet signature. ## Dust Storm Protocol

    On upstream failure, FarmDash returns `ok:false` with a typed degraded state

    and a `warnings` array containing `{ kind: "dust_storm", message: "..." }`. Cached SDK responses may be returned as stale with explicit stale-data age. ## x402 Payment Wall

    When Scout limits are exceeded, FarmDash returns HTTP 402 with

    `code: free_quota_exhausted`, `instruction: STOP_RETRYING`, the UTC reset time,

    upgrade URL, and x402 payment instructions.'
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT
servers:
- url: https://www.farmdash.one/api
  description: Production
tags:
- name: Execution
  description: Futures order execution and cancellation
paths:
  /v1/agent/continuation:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: selectExecutionContinuation
      summary: Select server-issued execution context without granting authority
      description: Returns a stored, capability-rechecked context and its canonical next operation. This does not quote, prepare, admit, debit, sign, or submit; unknown/expired IDs fail closed. The request accepts only the server-issued continuationId.
      tags:
      - Execution
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionContinuationSelectionRequest'
      responses:
        '200':
          description: Read-only selected continuation and machine-readable operation prerequisites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionContinuationSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown continuation ID
        '410':
          description: Continuation expired
        '503':
          description: Required capability or canonical resolver unavailable
  /agents/solana-swap:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: prepareSolanaSwap
      summary: Prepare an unsigned Solana swap for local wallet signature
      description: Prepares a user-signable Solana transaction after server-side mint, quote, simulation, wallet, idempotency, trial-admission and authority checks. `continuationId` is optional non-authoritative context correlation only; it does not relax any existing requirement or grant signing/submission authority. An expired unsigned preparation returns non-retryable 410 `solana_preparation_expired`; obtain a fresh preparation with a new idempotency key. A submitted or ambiguous 409 is not safe to resubmit; reconcile authoritative state first. Retry a retryable 503 only with the same stable idempotency key.
      tags:
      - Execution
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolanaSwapPrepareRequest'
      responses:
        '200':
          description: Unsigned prepared transaction requiring the customer wallet signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaSwapPrepareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Preparation conflict or submitted/ambiguous state; do not resubmit until authoritative reconciliation
        '410':
          description: Unsigned preparation expired; obtain a fresh preparation with a new idempotency key
        '503':
          description: Durable Solana preparation or canonical resolver unavailable; retry only with the same stable idempotency key
  /v1/agent/futures/prepare-order:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: prepareFuturesOrder
      summary: Prepare an exact Hyperliquid order for local EIP-712 signing
      description: 'Zero-custody execution bootstrap. FarmDash validates the market/account,

        fresh research gate for new risk, builder-fee approval and market_ioc price

        protection, then returns the exact Hyperliquid action, nonce, expiresAt,

        intentHash and EIP-712 typed data. FarmDash does not sign or submit.

        Sign typedData locally with agentAddress, then POST

        { ...executeRequest, signature } to /v1/agent/futures/execute-order.

        Commercial capacity never creates venue authority.'
      tags:
      - Execution
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareOrderRequest'
      responses:
        '200':
          description: Exact signable order preparation; no venue submission occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareOrderResponse'
        '422':
          description: Signed market_ioc limit violates live price protection
        '503':
          description: Preparation dependency unavailable
        '400':
          description: Invalid market, account authority, or order parameters
        '402':
          description: Payment or tier capacity required
        '409':
          description: Fresh research or owner builder-fee approval required
  /v1/agent/futures/execute-order:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: executeOrder
      summary: Execute a pre-signed order on Hyperliquid
      description: 'Forwards a pre-signed EIP-712 order to Hyperliquid. Requires prior

        execution-ready analyze-strategy call within 60 seconds for risk-increasing orders (parameter-bound research gate). Scout signed capacity or x402 overage applies; paid capacity never creates authority.

        FarmDash may receive routing compensation from supported venues. Risk guardrails enforced server-side.

        `nonce`, `expiresAt`, and `intentHash` are required for request-scoped

        expiry and auditability. `expiresAt` is forwarded as venue `expiresAfter`.

        `market_ioc` is a signed, price-protected IOC limit order with a live 100

        bps adverse-price cap, never an unbounded market order. It distinguishes

        full, partial, and zero fill; an IOC resting response is unknown/inconsistent.

        Venue nonce authority is `network + signer + nonce` across account and vault

        contexts. Durable replay control fails closed before submission.

        The signed order action discloses FarmDash builder `f=1`, which means

        0.1 bp (0.001%) of filled notional—not 1 bp. Resting/rejected/unfilled

        notional is not fee-bearing volume.

        WARNING: Real market actions can cause financial loss. USER_SIGNED requires fresh manual approval for each order/cancel. BOUNDED_AUTONOMOUS permits local agent signing without per-order confirmation only under a valid explicit owner-signed futures grant, authenticated session, venue delegation and all applicable gates. Futures bounded autonomy remains preparation_only until the production canary passes.'
      tags:
      - Execution
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteOrderRequest'
      parameters:
      - name: X-FarmDash-Session-Token
        in: header
        required: false
        schema:
          type: string
        description: Session capability for BOUNDED_AUTONOMOUS; does not grant venue signing authority
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Order execution result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteOrderResponse'
        '400':
          description: Risk check failed or research not performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /v1/agent/futures/cancel-order:
    parameters:
    - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
    - $ref: '#/components/parameters/X-FarmDash-Client'
    - $ref: '#/components/parameters/X-FarmDash-Client-Version'
    - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: cancelOrder
      summary: Cancel open Hyperliquid orders
      description: 'Cancels one or more open orders (max 50 per request).

        Scout capacity is available inside the shared 30 requests / 24h quota; Pioneer is capped at 1,500/day and Syndicate at 50,000/day. The returned entitlement and rate-limit state is authoritative. EIP-712 signature is required on every request.

        Required `expiresAt` is forwarded as venue `expiresAfter`; required

        `intentHash` binds the FarmDash request for auditability.

        HTTP 202 is returned only for `accepted` application acknowledgement, not final venue cancellation.

        Reconcile every requested ID through `/api/v1/agent/futures/reconcile-order`

        before dependent action. Venue nonce authority is `network + signer + nonce`

        across account and vault contexts; durable replay control fails closed before submission.

        WARNING: Real market actions can cause financial loss. USER_SIGNED requires fresh manual approval for each order/cancel. BOUNDED_AUTONOMOUS permits local agent signing without per-order confirmation only under a valid explicit owner-signed futures grant, authenticated session, venue delegation and all applicable gates. Futures bounded autonomy remains preparation_only until the production canary passes.'
      tags:
      - Execution
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      parameters:
      - name: X-FarmDash-Session-Token
        in: header
        required: false
        schema:
          type: string
        description: Session capability for BOUNDED_AUTONOMOUS; does not grant venue signing authority
      - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '202':
          description: Cancellation application acknowledgement; final venue cancellation requires reconciliation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
components:
  schemas:
    DustStormWarning:
      type: object
      required:
      - kind
      - message
      properties:
        kind:
          type: string
          const: dust_storm
        message:
          type: string
    ExecuteOrderRequest:
      type: object
      required:
      - agentAddress
      - coin
      - isBuy
      - size
      - price
      - orderType
      - nonce
      - expiresAt
      - intentHash
      - signature
      properties:
        executionTrialId:
          type: string
          description: Inherited durable futures lifecycle. Accepted orders commit; ambiguous submission stays held pending direct venue reconciliation.
        accountAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
          default: USER_SIGNED
          description: USER_SIGNED is preserved for unenrolled signers. Owner registration permanently enrolls the API wallet on its network across accounts, including after expiry/revocation; stripping mode/session fields cannot bypass bounded policy. Bounded dispatch returns nonretryable bounded_futures_preparation_only while rollout is not operational.
        grantId:
          type: string
          description: Required for BOUNDED_AUTONOMOUS
        sessionId:
          type: string
          description: Required for BOUNDED_AUTONOMOUS; binds session agent separately from API wallet
        sessionToken:
          type: string
          description: Session capability; alternatively X-FarmDash-Session-Token header
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        coin:
          type: string
        isBuy:
          type: boolean
        size:
          type: string
        price:
          type: string
        orderType:
          type: string
          enum:
          - limit_gtc
          - limit_ioc
          - limit_alo
          - market_ioc
          - stop_loss
          - take_profit
          description: '`market_ioc` is a signed, price-protected IOC limit order with a live 100 bps adverse-price cap, never an unbounded market order.'
        reduceOnly:
          type: boolean
          default: false
        leverage:
          oneOf:
          - type: number
          - type: string
        signedAction:
          type: object
          description: 'If supplied, must contain the signed FarmDash builder term `{ b: treasury, f: 1 }`; f is tenths of a basis point.'
        nonce:
          type: integer
        expiresAt:
          type: integer
        intentHash:
          type: string
        signature:
          $ref: '#/components/schemas/EIP712Signature'
    ExecutionContinuationCorrelation:
      type: object
      additionalProperties: false
      required:
      - continuation_id
      - source_type
      - source_ref
      - lifecycle_id
      - trail_id
      - execution_domain
      properties:
        continuation_id:
          type: string
          format: uuid
        source_type:
          type: string
          enum:
          - market_estimate
          - solana_preview
          - futures_analysis
        source_ref:
          type: string
        lifecycle_id:
          type: string
          format: uuid
        trail_id:
          type:
          - string
          - 'null'
        execution_domain:
          type: string
          enum:
          - spot
          - solana
          - futures
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    PrepareOrderExecuteRequest:
      type: object
      additionalProperties: false
      required:
      - agentAddress
      - coin
      - isBuy
      - size
      - price
      - orderType
      - accountAddress
      - reduceOnly
      - leverage
      - nonce
      - expiresAt
      - intentHash
      - signedAction
      - executionMode
      properties:
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        accountAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        coin:
          type: string
          pattern: ^[a-zA-Z0-9]{1,16}$
        isBuy:
          type: boolean
        size:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
        price:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
        orderType:
          type: string
          enum:
          - limit_gtc
          - limit_ioc
          - limit_alo
          - market_ioc
          - stop_loss
          - take_profit
        reduceOnly:
          type: boolean
          default: false
        leverage:
          oneOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 5
          - type: string
        nonce:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expiresAt:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
          default: USER_SIGNED
          description: Preparation is not execution authority. Bounded submission additionally requires an owner grant and authenticated session and remains subject to the canonical rollout gate.
        intentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        signedAction:
          type: object
          description: Exact Hyperliquid action including FarmDash builder terms; sign this action without modification.
    PrepareOrderRequest:
      type: object
      additionalProperties: false
      required:
      - agentAddress
      - coin
      - isBuy
      - size
      - price
      - orderType
      properties:
        executionTrialId:
          type: string
          description: Inherited durable analysis lifecycle identity; commercial permission only.
        continuationId:
          type: string
          format: uuid
          description: Optional server-issued context correlation; grants no execution authority.
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        accountAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        coin:
          type: string
          pattern: ^[a-zA-Z0-9]{1,16}$
        isBuy:
          type: boolean
        size:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
        price:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
        orderType:
          type: string
          enum:
          - limit_gtc
          - limit_ioc
          - limit_alo
          - market_ioc
          - stop_loss
          - take_profit
        reduceOnly:
          type: boolean
          default: false
        leverage:
          oneOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 5
          - type: string
        nonce:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expiresAt:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
          default: USER_SIGNED
          description: Preparation is not execution authority. Bounded submission additionally requires an owner grant and authenticated session and remains subject to the canonical rollout gate.
    CancelOrderRequest:
      type: object
      required:
      - agentAddress
      - coin
      - orderIds
      - nonce
      - expiresAt
      - intentHash
      - signature
      properties:
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
          default: USER_SIGNED
          description: USER_SIGNED is preserved for unenrolled signers. Owner registration permanently enrolls the API wallet on its network across accounts, including after expiry/revocation; stripping mode/session fields cannot bypass bounded policy. Bounded dispatch returns nonretryable bounded_futures_preparation_only while rollout is not operational.
        grantId:
          type: string
          description: Required for BOUNDED_AUTONOMOUS
        sessionId:
          type: string
          description: Required for BOUNDED_AUTONOMOUS; binds session agent separately from API wallet
        sessionToken:
          type: string
          description: Session capability; alternatively X-FarmDash-Session-Token header
        agentAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        coin:
          type: string
        orderIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: integer
        signedAction:
          type: object
        nonce:
          type: integer
        expiresAt:
          type: integer
        intentHash:
          type: string
        signature:
          $ref: '#/components/schemas/EIP712Signature'
    SolanaSwapPrepareRequest:
      type: object
      additionalProperties: false
      required:
      - wallet
      - inputMint
      - outputMint
      - amount
      properties:
        wallet:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        inputMint:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        outputMint:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        amount:
          type: string
          pattern: ^[1-9][0-9]*$
        continuationId:
          type: string
          format: uuid
          description: Optional context correlation only; does not create or change wallet authority.
        slippageBps:
          type: integer
          minimum: 1
          maximum: 500
        minAmountOut:
          type: string
          pattern: ^[1-9][0-9]*$
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
        executionTrialProof:
          $ref: '#/components/schemas/ExecutionTrialProof'
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
        sessionId:
          type: string
        grantId:
          type: string
        sessionToken:
          type: string
        signerPubkey:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
    PrepareOrderResponse:
      type: object
      required:
      - ok
      - state
      - executionMode
      - preparation
      - typedData
      - executeRequest
      - next_action
      - zeroCustody
      - privateKeyRequiredByFarmDash
      - timestamp
      properties:
        ok:
          type: boolean
          enum:
          - true
        state:
          type: string
          enum:
          - READY_FOR_LOCAL_SIGNATURE
        executionMode:
          type: string
          enum:
          - USER_SIGNED
          - BOUNDED_AUTONOMOUS
          default: USER_SIGNED
          description: Preparation is not execution authority. Bounded submission additionally requires an owner grant and authenticated session and remains subject to the canonical rollout gate.
        preparation:
          type: object
          required:
          - agentAddress
          - coin
          - isBuy
          - size
          - price
          - orderType
          - accountAddress
          - reduceOnly
          - leverage
          - assetIndex
          - signedAction
          - nonce
          - expiresAt
          - intentHash
          - vaultAddress
          - builder
          properties:
            agentAddress:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
            accountAddress:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
            coin:
              type: string
              pattern: ^[a-zA-Z0-9]{1,16}$
            isBuy:
              type: boolean
            size:
              type: string
              pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
            price:
              type: string
              pattern: ^(?:0|[1-9]\d*)(?:\.\d+)?$
            orderType:
              type: string
              enum:
              - limit_gtc
              - limit_ioc
              - limit_alo
              - market_ioc
              - stop_loss
              - take_profit
            reduceOnly:
              type: boolean
              default: false
            leverage:
              oneOf:
              - type: number
                exclusiveMinimum: 0
                maximum: 5
              - type: string
            nonce:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            expiresAt:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            intentHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            signedAction:
              type: object
              description: Exact Hyperliquid action including FarmDash builder terms; sign this action without modification.
            assetIndex:
              type: integer
              minimum: 0
            vaultAddress:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
              nullable: true
            builder:
              type: object
              required:
